name: Update

# Bam 1 nut: Actions -> "Update" -> Run workflow.
# 1) Gop nhanh (neu co) vao main  2) Sao luu D1  3) Migration  4) Deploy Worker  5) Kiem tra.
# Trang AMO (GitHub Pages) tu cap nhat sau 1-2 phut khi main doi.
# Can secret: AUTO247_TOKEN (push main), CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Nhanh can gop vao main (de trong = chi deploy main hien tai)'
        required: false
        default: 'feat/ui-soft'
      confirm:
        description: 'Giu nguyen DEPLOY de xac nhan'
        required: true
        default: 'DEPLOY'

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.event.inputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AUTO247_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gop nhanh vao main
        if: ${{ env.BRANCH != '' }}
        run: |
          set -e
          git config user.name "HCDecor"
          git config user.email "332891391+HCDecorAD@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git merge --no-ff "origin/$BRANCH" -m "Merge $BRANCH (Update)"
          git push origin main
      - name: Backup D1
        working-directory: shop-engine
        run: npx --yes wrangler@4 d1 export hcs --remote --config wrangler.toml --output "$RUNNER_TEMP/hcs-backup.sql"
      - uses: actions/upload-artifact@v4
        with:
          name: hcs-backup
          path: ${{ runner.temp }}/hcs-backup.sql
          retention-days: 14
      - name: Apply migrations
        working-directory: shop-engine
        run: npx wrangler@4 d1 migrations apply hcs --remote --config wrangler.toml
      - name: Deploy Worker
        working-directory: shop-engine
        run: npx wrangler@4 deploy --config wrangler.toml
      - name: Health check
        run: curl -fsS https://hc-shop-engine.huycuongonline.workers.dev/api/health
