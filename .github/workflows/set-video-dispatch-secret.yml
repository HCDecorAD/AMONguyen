name: Dua token dispatch video vao Worker (chay 1 lan)

# Chay tay: Actions -> "Dua token dispatch video vao Worker" -> Run workflow -> go DUA.
# Doc secret VIDEOSP_TOKEN_SRC (GitHub fine-grained PAT, quyen Actions: Read and write
# tren repo AMONguyen) va dua vao Cloudflare Worker shop-engine lam secret GH_DISPATCH_TOKEN,
# de nut "Tao video" trong Shop Manager tu kich hoat GitHub Actions duoc.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Go DUA de xac nhan ghi secret len Worker production'
        required: true

permissions:
  contents: read

concurrency:
  group: set-video-dispatch-secret
  cancel-in-progress: false

jobs:
  set-secret:
    if: ${{ github.event.inputs.confirm == 'DUA' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shop-engine
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VIDEOSP_TOKEN_SRC: ${{ secrets.VIDEOSP_TOKEN_SRC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiem tra secret nguon
        run: |
          if [ -z "$VIDEOSP_TOKEN_SRC" ]; then
            echo "Thieu secret VIDEOSP_TOKEN_SRC trong repo. Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
      - name: Dua vao Worker lam secret GH_DISPATCH_TOKEN
        run: printf '%s' "$VIDEOSP_TOKEN_SRC" | npx wrangler@4 secret put GH_DISPATCH_TOKEN --config wrangler.toml
