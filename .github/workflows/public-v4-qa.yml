name: AMO Public V4 QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public V4 release gate
        shell: cmd
        run: tools\amo-release-v4.bat
      - name: Upload public package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMO-Public-V4
          path: |
            dist-public
            AMO-Nguyen-Public-V4.zip
            AMO-Nguyen-Public-V4.sha256.txt
          if-no-files-found: error
          retention-days: 14
