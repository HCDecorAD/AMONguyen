<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HC Visual Builder</title><link rel="stylesheet" href="../vendor/grapesjs/dist/css/grapes.min.css">
<style>html,body{height:100%;margin:0}body{font-family:Segoe UI,Arial;background:#0b0d10}.bar{height:52px;background:#0d1117;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #252b34}.bar b{margin-right:auto}.bar button,.bar a{border:0;border-radius:7px;padding:8px 11px;background:#20262f;color:#fff;text-decoration:none;cursor:pointer}.bar .primary{background:#246bfe}.bar .ok{background:#16794b}.bar span{color:#9aa4b2;font-size:12px}#gjs{height:calc(100vh - 52px);border:0}.gjs-one-bg{background:#11151b}.gjs-two-color{color:#dce3ec}</style></head><body>
<div class="bar"><b>HC Visual Builder · AMO</b><select id="pageSel" onchange="changePage()" style="background:#20262f;color:white;border:1px solid #303846;border-radius:7px;padding:8px"></select><span id="state">Bản nháp cục bộ</span><button onclick="loadSite()">Tải lại trang</button><button onclick="saveDraft()">Lưu bản nháp</button><button class="primary" onclick="exportHtml()">Xuất HTML</button><a href="../editor.html">HC Admin</a></div>
<div id="gjs"></div><script src="../vendor/grapesjs/dist/grapes.min.js"></script><script>
let target='../index.html'; let editor; async function loadPages(){const d=await fetch('pages.json').then(r=>r.json());const s=document.getElementById('pageSel');d.pages.forEach(p=>{const o=document.createElement('option');o.value=p.file;o.textContent=p.label;s.appendChild(o)})} function changePage(){target='../'+document.getElementById('pageSel').value;loadSite()} loadPages();
async function loadSite(){document.getElementById('state').textContent='Đang tải...';const html=await fetch(target+'?v='+Date.now()).then(r=>r.text()); const body=(html.match(/<body[^>]*>([\s\S]*?)<\/body>/i)||[])[1]||html; const css=[...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)].map(x=>x[1]).join('\n'); init(body,css)}
function init(body,css){if(editor)editor.destroy();editor=grapesjs.init({container:'#gjs',height:'100%',fromElement:false,storageManager:false,components:body,style:css,blockManager:{appendTo:'.gjs-blocks-c'},deviceManager:{devices:[{name:'Desktop',width:''},{name:'Tablet',width:'768px'},{name:'Mobile',width:'390px'}]}});const bm=editor.BlockManager;bm.add('hc-section',{label:'Section',category:'HC Blocks',content:'<section style="padding:64px 24px"><div style="max-width:1100px;margin:auto"><h2>Tiêu đề Section</h2><p>Nội dung mới</p></div></section>'});bm.add('hc-heading',{label:'Heading',category:'HC Blocks',content:'<h2>Tiêu đề</h2>'});bm.add('hc-text',{label:'Text',category:'HC Blocks',content:'<p>Nhập nội dung tại đây</p>'});bm.add('hc-image',{label:'Image',category:'HC Blocks',content:{type:'image'}});bm.add('hc-button',{label:'Button',category:'HC Blocks',content:'<a href="#" style="display:inline-block;padding:12px 18px;background:#111;color:#fff;text-decoration:none">Nút</a>'});document.getElementById('state').textContent='Sẵn sàng · kéo thả trực tiếp'}
function saveDraft(){if(!editor)return;localStorage.setItem('hc-builder-AMO',JSON.stringify({html:editor.getHtml(),css:editor.getCss()}));document.getElementById('state').textContent='Đã lưu bản nháp trên máy'}
function exportHtml(){if(!editor)return;const out='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+editor.getCss()+'</style></head><body>'+editor.getHtml()+'</body></html>';const b=new Blob([out],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.visual.html';a.click();URL.revokeObjectURL(a.href);document.getElementById('state').textContent='Đã xuất HTML · Publish GitHub sẽ tích hợp ở bước an toàn kế tiếp'}
loadSite();
</script></body></html>
