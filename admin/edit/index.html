<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AMO Nguyễn — Editor</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#0b0a08;color:#eee3cc}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{padding:25px 16px;border-right:1px solid #49391d}.brand{color:#d8ae55;font-size:20px;font-weight:bold;margin-bottom:28px}.nav button{display:block;width:100%;text-align:left;padding:12px;margin:5px 0;background:#17130d;color:#ddd0b5;border:1px solid #3c301c;border-radius:7px;cursor:pointer}.nav button:hover{border-color:#d8ae55}main{padding:30px}.bar{display:flex;justify-content:space-between;align-items:center}.save{background:#d8ae55;border:0;padding:12px 18px;font-weight:bold;border-radius:6px;cursor:pointer}.panel{margin-top:25px;max-width:900px}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;color:#d8ae55}.field input,.field textarea{width:100%;padding:12px;background:#15120d;color:#eee3cc;border:1px solid #4b3b20;border-radius:6px}.field textarea{min-height:150px}.note{margin-top:20px;padding:15px;border:1px solid #4b3b20;color:#aaa08f}@media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none}}</style></head><body><div class="app"><aside><div class="brand">AMO NGUYỄN</div><div class="nav"><button onclick="page('home')">Trang chủ</button><button onclick="page('shop')">Sản phẩm</button><button onclick="page('brands')">Thương hiệu</button><button onclick="page('about')">Giới thiệu</button><button onclick="page('policy')">Chính sách</button><button onclick="page('contact')">Liên hệ</button></div></aside><main><div class="bar"><div><h1 id="title">EDIT WEBSITE</h1><small>AMO Nguyễn · Admin Editor</small></div><button class="save" onclick="save()">LƯU</button></div><div class="panel"><div class="field"><label>Tiêu đề</label><input id="heading"></div><div class="field"><label>Nội dung</label><textarea id="content"></textarea></div><div class="field"><label>Hình ảnh / Media</label><input id="media" placeholder="assets/images/..."></div><div class="note" id="status">Editor nội bộ AMO — không chuyển sang Pages CMS.</div></div></main></div><script>const data={home:['Trang chủ','SHOP GIÀY SI AMO NGUYỄN'],shop:['Sản phẩm','Giày sneaker · Giày công sở · Dép · Áo + Áo khoác · Túi xách · Quần · Thắt lưng + phụ kiện'],brands:['Thương hiệu','LV · GUCCI · Salvatore Ferragamo · BALLY · KHÁC'],about:['Giới thiệu','SHOP GIÀY SI HIỆU NAM – AMO NGUYỄN'],policy:['Chính sách bán hàng','Thử chân · Đổi size/mẫu · Miễn phí ship · Cọc giữ hàng'],contact:['Liên hệ','ĐT/Zalo: 093.268.0592']};let current='home';function page(k){current=k;title.textContent='EDIT — '+data[k][0];heading.value=data[k][0];content.value=data[k][1];status.textContent='Đang chỉnh: '+data[k][0]}function save(){localStorage.setItem('amo-edit-'+current,JSON.stringify({heading:heading.value,content:content.value,media:media.value}));status.textContent='Đã lưu bản chỉnh sửa trên trình duyệt. Chức năng Publish vào source sẽ được nối ở bước tiếp theo.'}page('home')</script></body></html>
