<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEMO · HC Visual Builder v7.1 · AMO</title><link rel="stylesheet" href="../vendor/grapesjs/dist/css/grapes.min.css"><style>html,body{height:100%;margin:0;font-family:Segoe UI,Arial;background:#0b0d10}.bar{height:64px;background:#0d1117;color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #252b34}.bar b{margin-right:4px}.bar select,.bar button,.bar a{background:#20262f;color:#fff;border:1px solid #303846;border-radius:7px;padding:8px 10px;text-decoration:none;cursor:pointer}.bar .primary{background:#246bfe}.bar .publish{background:#16794b}.bar span{margin-left:auto;color:#a7b0bd;font-size:12px}#gjs{height:calc(100vh - 64px);border:0}.gjs-one-bg{background:#11151b}.gjs-two-color{color:#dce3ec}.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:8px}.brand small{color:#7f8b9b;font-size:10px;font-weight:500;margin-top:4px}.sep{width:1px;height:28px;background:#2b3440;margin:0 3px}.device.active{background:#246bfe;border-color:#4f88ff}.bar .state{margin-left:auto;padding:7px 10px;border:1px solid #2b3542;border-radius:999px;background:#111820}.bar .media{background:#171d25}</style></head><body>
<div class="bar"><div class="brand"><b>HC Visual · AMO</b><small id="version">v7.1 · GitHub Edition</small></div><select id="pageSel" onchange="changePage()"></select><span class="sep"></span><button class="device active" data-device="Desktop" onclick="device(this)">Desktop</button><button class="device" data-device="Tablet" onclick="device(this)">Tablet</button><button class="device" data-device="Mobile" onclick="device(this)">Mobile</button><span class="sep"></span><button onclick="loadSite()">Reload</button><button onclick="saveDraft()">Save Draft</button><button onclick="preview()">Preview</button><a class="media" href="https://app.pagescms.org/" target="_blank">Media</a><button class="publish" onclick="publish()">Publish</button><button onclick="rollback()">Rollback</button><a href="../editor.html">Admin</a><span class="state" id="state">Booting…</span></div><div id="gjs"></div>
<script src="../vendor/grapesjs/dist/grapes.min.js"></script><script>
let SITE='AMO',BRIDGE='http://127.0.0.1:17321',PROJECT={};let target='../index.html',editor,sourceHead='',sourceScripts='';
async function loadProject(){try{PROJECT=await fetch('hc-visual-v7-demo.project.json?v='+Date.now()).then(r=>r.json());SITE=PROJECT.site||SITE;BRIDGE=PROJECT.compatibility?.publishBridge||BRIDGE;document.getElementById('version').textContent='v'+(PROJECT.visualVersion||'7.1.0')+' · GitHub Edition'}catch(e){console.warn('Project manifest fallback',e)}}
async function loadPages(){const d=await fetch('pages.json').then(r=>r.json()),s=document.getElementById('pageSel');s.innerHTML='';d.pages.forEach(p=>{const o=document.createElement('option');o.value=p.file;o.textContent=p.label;s.appendChild(o)})}
function page(){return document.getElementById('pageSel').value||'index.html'} function changePage(){target='../'+page();loadSite()}
async function loadSite(){state('Loading...');const html=await fetch(target+'?v='+Date.now()).then(r=>r.text());sourceHead=(html.match(/<head[^>]*>([\s\S]*?)<\/head>/i)||[])[1]||'';const body=(html.match(/<body[^>]*>([\s\S]*?)<\/body>/i)||[])[1]||html;sourceScripts=[...body.matchAll(/<script[\s\S]*?<\/script>/gi)].map(x=>x[0]).join('\n');const clean=body.replace(/<script[\s\S]*?<\/script>/gi,'');const css=[...sourceHead.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)].map(x=>x[1]).join('\n');init(clean,css)}
function init(body,css){if(editor)editor.destroy();editor=grapesjs.init({container:'#gjs',height:'100%',storageManager:false,components:body,style:css,deviceManager:{devices:[{name:'Desktop',width:''},{name:'Tablet',width:'768px'},{name:'Mobile',width:'390px'}]}});const b=editor.BlockManager;b.add('section',{label:'Section',category:'HC Blocks',content:'<section style="padding:64px 24px"><div style="max-width:1100px;margin:auto"><h2>Section title</h2><p>Content</p></div></section>'});b.add('heading',{label:'Heading',category:'HC Blocks',content:'<h2>Heading</h2>'});b.add('text',{label:'Text',category:'HC Blocks',content:'<p>Text content</p>'});b.add('image',{label:'Image',category:'HC Blocks',content:{type:'image'}});b.add('button',{label:'Button',category:'HC Blocks',content:'<a href="#" style="display:inline-block;padding:12px 18px;background:#111;color:#fff">Button</a>'});state('Ready')}
function state(x){document.getElementById('state').textContent=x}
function device(btn){if(!editor)return;document.querySelectorAll('.device').forEach(x=>x.classList.remove('active'));btn.classList.add('active');editor.setDevice(btn.dataset.device);state(btn.dataset.device+' canvas')}
function output(){if(!editor)throw Error('Editor not ready');let head=sourceHead.replace(/<style id="hc-visual-css">[\s\S]*?<\/style>/i,'');return '<!doctype html><html><head>'+head+'<style id="hc-visual-css">'+editor.getCss()+'</style></head><body>'+editor.getHtml()+sourceScripts+'</body></html>'}
function validate(h){const e=[];if(!/<html/i.test(h)||!/<body/i.test(h))e.push('HTML structure');if(h.length<100)e.push('Document too small');if(!sourceHead)e.push('Missing original head');return e}
function saveDraft(){localStorage.setItem('hc-builder-'+SITE+'-'+page(),output());state('Draft saved')}
function preview(){const h=output(),e=validate(h);if(e.length)return state('Validation failed: '+e.join(', '));const w=open();w.document.open();w.document.write(h);w.document.close();state('Preview opened')}
async function publish(){const h=output(),e=validate(h);if(e.length)return state('Validation failed: '+e.join(', '));if(!confirm('Publish '+page()+' to production?'))return;state('Publishing...');try{const r=await fetch(BRIDGE+'/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({site:SITE,page:page(),html:h})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Publish failed');state(d.unchanged?'No changes':'Published '+d.sha.slice(0,7))}catch(err){state('Publish bridge unavailable - use Pages CMS / GitHub owner flow');alert(String(err.message||err))}}
async function rollback(){if(!confirm('Rollback latest visual publish?'))return;state('Rolling back...');try{const r=await fetch(BRIDGE+'/rollback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({site:SITE})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Rollback failed');state('Rollback '+d.sha.slice(0,7));setTimeout(loadSite,1200)}catch(err){state('Rollback unavailable');alert(String(err.message||err))}}
(async()=>{await loadProject();await loadPages();await loadSite()})();
</script></body></html>
