<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HC Shop Manager</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#0b0e12;color:#e9eef5}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#11161d;border-right:1px solid #27303a;padding:22px}.brand{font-size:19px;font-weight:700;margin-bottom:24px}.store{padding:10px;background:#19212b;border-radius:8px;margin-bottom:20px}.nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:11px;border:0;border-radius:7px;background:transparent;color:#b8c2cf;cursor:pointer}.nav button:hover,.nav .on{background:#202a36;color:white}.main{padding:28px}.top{display:flex;align-items:center;justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:22px 0}.card,.panel{background:#131920;border:1px solid #27303a;border-radius:12px;padding:18px}.card b{font-size:24px;display:block;margin-top:8px}.panel{margin-top:15px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #27303a}button.primary{background:#246bfe;color:white;border:0;border-radius:7px;padding:10px 14px}.muted{color:#8f9baa}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<div class="app"><aside class="side"><div class="brand">HC Shop Manager</div><div class="store">AMO NGUYEN<br><small class="muted">Store #001</small></div><div class="nav"><button class="on" onclick="view('dashboard')">Tổng quan</button><button onclick="view('products')">Sản phẩm</button><button onclick="view('inventory')">Kho hàng</button><button onclick="view('orders')">Đơn hàng</button><button>Khách hàng</button><button>Khuyến mãi</button><button>Website</button><button>Báo cáo</button></div></aside><main class="main"><div class="top"><div><h1 id="title">Tổng quan</h1><div class="muted">HC Multi-Shop Engine · AMO</div></div><a href="editor.html" style="color:#9ec1ff">HC Admin</a></div><div id="content"></div></main></div>
<script>const API=location.hostname==="localhost"?"http://127.0.0.1:8787":(localStorage.HC_SHOP_API||"");const h={"x-store-id":"store_amo"};const money=n=>new Intl.NumberFormat("vi-VN").format(n||0)+" đ";async function api(p){if(!API)return {offline:true};return fetch(API+p,{headers:h}).then(r=>r.json())}
async function view(v){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));const c=document.getElementById("content");if(v==="dashboard"){title.textContent="Tổng quan";const d=await api("/api/dashboard");c.innerHTML='<div class="cards">'+[["Tổng tồn",d.total_stock],["Sắp hết",d.low_stock],["Hết hàng",d.out_stock],["Đơn mới",d.new_orders],["Tổng đơn",d.orders],["Doanh thu",money(d.revenue)]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><b>'+((x[1]??"—"))+'</b></div>').join("")+'</div><div class="panel"><h3>Hệ thống</h3><p>Product · Inventory · Orders · Customers · Promotions · Content · Reports</p></div>'}
if(v==="products"){title.textContent="Sản phẩm";const d=await api("/api/products");c.innerHTML='<div class="panel"><div class="top"><h3>Product Manager</h3><button class="primary">+ Sản phẩm</button></div>'+table(d.items||[],["name","status","price","sale_price"])+"</div>"}
if(v==="inventory"){title.textContent="Kho hàng";const d=await api("/api/inventory");c.innerHTML='<div class="panel"><h3>Inventory</h3>'+table(d.items||[],["sku","name","size","color","on_hand","reserved","available"])+"</div>"}
if(v==="orders"){title.textContent="Đơn hàng";const d=await api("/api/orders");c.innerHTML='<div class="panel"><h3>Order Manager</h3>'+table(d.items||[],["order_no","status","total","created_at"])+"</div>"}}
function table(rows,cols){return '<table><thead><tr>'+cols.map(x=>"<th>"+x+"</th>").join("")+'</tr></thead><tbody>'+rows.map(r=>"<tr>"+cols.map(x=>"<td>"+(x.includes("price")||x==="total"?money(r[x]):(r[x]??""))+"</td>").join("")+"</tr>").join("")+"</tbody></table>"}
view("dashboard");</script></body></html>
