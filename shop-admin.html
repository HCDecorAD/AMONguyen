<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HC Shop Manager</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#0b0e12;color:#e9eef5}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#11161d;border-right:1px solid #27303a;padding:20px}.brand{font-size:20px;font-weight:750;margin-bottom:18px}.store{padding:12px;background:#19212b;border-radius:10px;margin-bottom:15px}.nav button{display:block;width:100%;text-align:left;margin:4px 0;padding:10px;border:0;border-radius:8px;background:transparent;color:#b8c2cf;cursor:pointer}.nav button.on,.nav button:hover{background:#202a36;color:#fff}.main{padding:26px;overflow:auto}.top,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:10px;margin:20px 0}.card,.panel{background:#131920;border:1px solid #27303a;border-radius:12px;padding:16px}.card b{font-size:22px;display:block;margin-top:8px}.panel{margin-top:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px;border-bottom:1px solid #27303a}button,.btn{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;background:#25303c;color:#e9eef5;text-decoration:none}.primary{background:#246bfe}.danger{background:#61252a}.muted{color:#8f9baa}.ok{color:#6ee7a8}.login{max-width:430px;margin:14vh auto;background:#131920;border:1px solid #27303a;padding:28px;border-radius:14px}input,select,textarea{width:100%;background:#0c1117;color:#fff;border:1px solid #34404d;border-radius:8px;padding:10px;margin:6px 0 12px}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20}.modal.on{display:grid}.box{width:min(560px,92vw);max-height:90vh;overflow:auto;background:#151c24;padding:22px;border-radius:14px;border:1px solid #34404d}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:950px){.app{grid-template-columns:1fr}.side{position:static}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="root"></div><div class="modal" id="modal"><div class="box" id="box"></div></div><script>
const API="https://hc-shop-engine.huycuongonline.workers.dev";let STORE=sessionStorage.HC_STORE||"store_amo",TOKEN=sessionStorage.HC_SHOP_TOKEN||"";
const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n||0))+" đ",esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,opt={}){const h={"x-store-id":STORE,"content-type":"application/json"};if(TOKEN)h.authorization="Bearer "+TOKEN;const r=await fetch(API+p,{...opt,headers:{...h,...opt.headers}}),d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error("Phiên quản trị không hợp lệ")}if(!r.ok)throw Error(d.error||"API error");return d}
function login(){root.innerHTML='<div class="login"><h2>HC Shop Manager</h2><p class="muted">Multi-Store Commerce</p><label>Mã quản trị</label><input id="tok" type="password" autofocus><button class="primary" onclick="doLogin()">Đăng nhập</button></div>'}
async function doLogin(){TOKEN=tok.value.trim();try{await api("/api/dashboard");sessionStorage.HC_SHOP_TOKEN=TOKEN;app()}catch(e){alert(e.message);TOKEN="";sessionStorage.removeItem("HC_SHOP_TOKEN")}}
function logout(){TOKEN="";sessionStorage.removeItem("HC_SHOP_TOKEN");login()}
async function app(){root.innerHTML='<div class="app"><aside class="side"><div class="brand">HC Shop Manager</div><div class="store"><b id="storeName">Store</b><select id="storeSelect" onchange="switchStore(this.value)"></select><button onclick="storeForm()">+ Thêm Store</button></div><div class="nav">'+[["dashboard","Tổng quan"],["products","Sản phẩm & Media"],["inventory","Kho hàng"],["channels","Kênh & Listings"],["datacenter","HC Data Center"],["orders","Đơn hàng"],["customers","Khách hàng"],["promotions","Khuyến mãi"],["reports","Báo cáo"]].map(x=>'<button data-v="'+x[0]+'" onclick="view(\''+x[0]+'\')">'+x[1]+'</button>').join("")+'</div></aside><main class="main"><div class="top"><div><h1 id="title">HC Shop</h1><div class="muted">Multi-tenant · Cloudflare D1</div></div><div><a class="btn" href="shop.html">Website</a> <a class="btn" href="editor.html">HC Admin</a> <button onclick="logout()">Thoát</button></div></div><div id="content"></div></main></div>';await loadStores();view("dashboard")}
async function loadStores(){const d=await api("/api/stores"),sel=document.getElementById("storeSelect");if(!d.items.find(x=>x.id===STORE))STORE=d.items[0]?.id||"store_amo";sel.innerHTML=d.items.map(x=>'<option value="'+x.id+'" '+(x.id===STORE?"selected":"")+'>'+esc(x.name)+' · '+esc(x.code)+'</option>').join("");const x=d.items.find(x=>x.id===STORE);if(x)storeName.textContent=x.name}
async function switchStore(v){STORE=v;sessionStorage.HC_STORE=v;await loadStores();view("dashboard")}
function table(rows,cols,action){return '<div style="overflow:auto"><table><thead><tr>'+cols.map(x=>'<th>'+x[0]+'</th>').join("")+(action?'<th></th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(x=>'<td>'+esc(x[1](r))+'</td>').join("")+(action?'<td>'+action(r)+'</td>':'')+'</tr>').join("")+'</tbody></table></div>'}
function setnav(v,label){title.textContent=label;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
async function view(v){try{
 if(v==="dashboard"){setnav(v,"Tổng quan");const d=await api("/api/dashboard");content.innerHTML='<div class="cards">'+[["Tổng tồn",d.total_stock],["Sắp hết",d.low_stock],["Hết hàng",d.out_stock],["Đơn mới",d.new_orders],["Tổng đơn",d.orders],["Doanh thu",money(d.revenue)]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join("")+'</div><div class="panel"><b class="ok">● Commerce Production Online</b><p>Store → Product → Media → SKU → Inventory → Checkout → Orders → Customers → Reports</p></div>'}
 if(v==="products"){setnav(v,"Sản phẩm & Media");const d=await api("/api/products");content.innerHTML='<div class="panel"><div class="actions"><h3>Product Manager</h3><button class="primary" onclick="productForm()">+ Sản phẩm</button></div>'+table(d.items||[],[["Tên",r=>r.name],["Trạng thái",r=>r.status],["Giá",r=>money(r.price)],["Sale",r=>r.sale_price?money(r.sale_price):"—"]],r=>'<button onclick="variantForm(\''+r.id+'\',\''+esc(r.name)+'\')">+ SKU</button> <button onclick="mediaForm(\''+r.id+'\',\''+esc(r.name)+'\')">+ Media</button> <button class="danger" onclick="archive(\''+r.id+'\')">Ẩn</button>')+'</div>'}
 if(v==="inventory"){setnav(v,"Kho hàng");const d=await api("/api/inventory");content.innerHTML='<div class="panel"><h3>Inventory</h3>'+table(d.items||[],[["SKU",r=>r.sku],["Sản phẩm",r=>r.name],["Size",r=>r.size],["Màu",r=>r.color],["Tồn",r=>r.on_hand],["Giữ",r=>r.reserved],["Có thể bán",r=>r.available]],r=>'<button onclick="stockForm(\''+r.variant_id+'\',\''+r.sku+'\')">Điều chỉnh</button>')+'</div>'}
 if(v==="channels"){setnav(v,"Kênh & Listings");const [c,l]=await Promise.all([api("/api/v1/channels"),api("/api/v1/listings")]);content.innerHTML='<div class="cards">'+(c.items||[]).map(x=>'<div class="card"><span class="muted">'+esc(x.type)+'</span><b>'+esc(x.name)+'</b><small>'+esc(x.code)+'</small></div>').join("")+'</div><div class="panel"><h3>Listings</h3>'+table(l.items||[],[["Sản phẩm",r=>r.product_name],["Kênh",r=>r.channel_name],["Trạng thái",r=>r.status],["Giá",r=>money(r.selling_price)]])+'</div>'}
 if(v==="datacenter"){setnav(v,"HC Data Center");const d=await api("/api/v1/import-jobs");content.innerHTML='<div class="panel"><div class="actions"><div><h3>Import Jobs</h3><p class="muted">Draft → Mapping → Validation → Dry Run → Review → Approval → Commit</p></div><span class="btn">Commit locked</span></div>'+table(d.items||[],[["File",r=>r.filename||r.id],["Loại",r=>r.kind],["Trạng thái",r=>r.status],["Summary",r=>r.summary_json||"{}"]],r=>'<button onclick="importDetail(\''+r.id+'\')">Chi tiết</button>')+'</div>'}
 if(v==="orders"){setnav(v,"Đơn hàng");const d=await api("/api/orders");content.innerHTML='<div class="panel"><h3>Order Manager</h3>'+table(d.items||[],[["Mã",r=>r.order_no],["Khách",r=>r.customer_name||"—"],["Điện thoại",r=>r.customer_phone||"—"],["Trạng thái",r=>r.status],["Tổng",r=>money(r.total)]],r=>'<button onclick="orderDetail(\''+r.id+'\')">Chi tiết</button> <button onclick="orderStatus(\''+r.id+'\',\''+r.status+'\')">Trạng thái</button>')+'</div>'}
 if(v==="customers"){setnav(v,"Khách hàng");const d=await api("/api/customers");content.innerHTML='<div class="panel"><h3>Customers</h3>'+table(d.items||[],[["Tên",r=>r.name],["Điện thoại",r=>r.phone],["Email",r=>r.email],["Địa chỉ",r=>r.address]])+'</div>'}
 if(v==="promotions"){setnav(v,"Khuyến mãi");const d=await api("/api/promotions");content.innerHTML='<div class="panel"><h3>Promotions</h3>'+table(d.items||[],[["Mã",r=>r.code],["Tên",r=>r.name],["Loại",r=>r.type],["Giá trị",r=>r.value],["Bật",r=>r.active?"Có":"Không"]])+'</div>'}
 if(v==="reports"){setnav(v,"Báo cáo");const d=await api("/api/reports");content.innerHTML='<div class="panel"><h3>Bán chạy</h3>'+table(d.best_sellers||[],[["SKU",r=>r.sku],["Tên",r=>r.name],["SL",r=>r.qty],["Doanh thu",r=>money(r.revenue)]])+'</div><div class="panel"><h3>Lịch sử kho</h3>'+table(d.movements||[],[["Loại",r=>r.type],["SL",r=>r.qty],["Tham chiếu",r=>r.reference_type],["Ngày",r=>r.created_at]])+'</div>'}
 }catch(e){content.innerHTML='<div class="panel">'+esc(e.message)+'</div>'}}
function openBox(x){box.innerHTML=x;modal.classList.add("on")}function closeBox(){modal.classList.remove("on")}
function storeForm(){openBox('<h3>Thêm Store</h3><label>Mã Store</label><input id="sc" placeholder="STORE2"><label>Tên Store</label><input id="sn"><label>Domain</label><input id="sd"><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="saveStore()">Tạo Store</button>')}
async function saveStore(){const d=await api("/api/stores",{method:"POST",body:JSON.stringify({code:sc.value,name:sn.value,domain:sd.value})});STORE=d.id;sessionStorage.HC_STORE=STORE;closeBox();await loadStores();view("dashboard")}
function productForm(){openBox('<h3>Thêm sản phẩm</h3><label>Tên</label><input id="pn"><div class="row"><div><label>Giá</label><input id="pp" type="number"></div><div><label>Giá sale</label><input id="ps" type="number"></div></div><label>Mô tả</label><textarea id="pd"></textarea><label>Trạng thái</label><select id="pst"><option value="active">Đang bán</option><option value="draft">Nháp</option></select><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="saveProduct()">Lưu</button>')}
async function saveProduct(){await api("/api/products",{method:"POST",body:JSON.stringify({name:pn.value,price:+pp.value,sale_price:ps.value?+ps.value:null,description:pd.value,status:pst.value})});closeBox();view("products")}
function variantForm(pid,name){openBox('<h3>SKU / Biến thể · '+esc(name)+'</h3><input id="vpid" type="hidden" value="'+pid+'"><div class="row"><div><label>SKU *</label><input id="sku"></div><div><label>Barcode</label><input id="barcode"></div></div><div class="row"><div><label>Size</label><input id="size"></div><div><label>Màu</label><input id="color"></div></div><div class="row"><div><label>Giá vốn</label><input id="cost" type="number"></div><div><label>Giá bán riêng SKU</label><input id="vprice" type="number"></div></div><div class="row"><div><label>Tồn đầu</label><input id="vonhand" type="number" value="0"></div><div><label>Đang về</label><input id="vincoming" type="number" value="0"></div></div><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="saveVariant()">Lưu SKU</button>')}
async function saveVariant(){await api("/api/variants",{method:"POST",body:JSON.stringify({product_id:vpid.value,sku:sku.value,barcode:barcode.value,size:size.value,color:color.value,cost:cost.value?+cost.value:null,price:vprice.value?+vprice.value:null,on_hand:+vonhand.value||0,incoming:+vincoming.value||0})});closeBox();view("inventory")}
function mediaForm(pid,name){openBox('<h3>Media · '+esc(name)+'</h3><input id="mpid" type="hidden" value="'+pid+'"><label>URL ảnh</label><input id="murl" placeholder="/assets/images/... hoặc URL ảnh"><label>Alt</label><input id="malt"><label>Thứ tự</label><input id="msort" type="number" value="0"><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="saveMedia()">Thêm ảnh</button>')}
async function saveMedia(){await api("/api/images",{method:"POST",body:JSON.stringify({product_id:mpid.value,url:murl.value,alt:malt.value,sort_order:+msort.value})});closeBox();view("products")}
function stockForm(id,sku){openBox('<h3>Điều chỉnh kho · '+esc(sku)+'</h3><input id="vid" type="hidden" value="'+id+'"><label>Số lượng (+ nhập / - xuất)</label><input id="qty" type="number"><label>Ghi chú</label><input id="note"><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="saveStock()">Cập nhật</button>')}
async function saveStock(){await api("/api/inventory/adjust",{method:"POST",body:JSON.stringify({variant_id:vid.value,qty:+qty.value,note:note.value})});closeBox();view("inventory")}
async function archive(id){if(confirm("Ẩn sản phẩm này?")){await api("/api/products/"+id,{method:"PATCH",body:JSON.stringify({status:"archived"})});view("products")}}
async function importDetail(id){const d=await api("/api/v1/import-jobs/"+id);openBox('<h3>Import · '+esc(d.filename||d.id)+'</h3><p><b>'+esc(d.kind)+'</b> · '+esc(d.status)+'</p><p class="muted">Summary: '+esc(d.summary_json||"{}")+'</p><div style="overflow:auto"><table><thead><tr><th>#</th><th>Status</th><th>Dữ liệu</th><th>Lỗi</th></tr></thead><tbody>'+(d.rows||[]).map(r=>'<tr><td>'+r.row_no+'</td><td>'+esc(r.status)+'</td><td><code>'+esc(r.canonical_json)+'</code></td><td>'+esc(r.errors_json)+'</td></tr>').join("")+'</tbody></table></div><p class="muted">Commit/Publish đang khóa, cần approval.</p><button onclick="closeBox()">Đóng</button>')}
async function orderDetail(id){const d=await api("/api/orders/"+id);openBox('<h3>Đơn '+esc(d.order_no)+'</h3><p><b>'+esc(d.customer_name)+'</b> · '+esc(d.customer_phone)+'</p><p>'+esc(d.shipping_address)+'</p><p>'+d.items.map(x=>esc(x.name)+' · '+esc(x.sku)+' × '+x.qty+' = '+money(x.line_total)).join("<br>")+'</p><p><b>Tổng: '+money(d.total)+'</b></p><button onclick="closeBox()">Đóng</button>')}
async function orderStatus(id,st){const map={new:["confirmed","cancelled"],confirmed:["packing","cancelled"],packing:["shipping","cancelled"],shipping:["completed","returned"],completed:["returned"]},a=map[st]||[];if(!a.length)return alert("Không còn chuyển trạng thái");const n=prompt("Trạng thái mới: "+a.join(" / "),a[0]);if(n&&a.includes(n)){await api("/api/orders/"+id+"/status",{method:"POST",body:JSON.stringify({status:n})});view("orders")}}
TOKEN?api("/api/dashboard").then(app).catch(login):login();
</script></body></html>
