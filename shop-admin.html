<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HC Shop Manager</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#0b0e12;color:#e9eef5}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#11161d;border-right:1px solid #27303a;padding:22px}.brand{font-size:20px;font-weight:750;margin-bottom:20px}.store{padding:12px;background:#19212b;border-radius:10px;margin-bottom:18px}.nav button{display:block;width:100%;text-align:left;margin:4px 0;padding:11px;border:0;border-radius:8px;background:transparent;color:#b8c2cf;cursor:pointer}.nav button:hover,.nav button.on{background:#202a36;color:#fff}.main{padding:28px;overflow:auto}.top,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:12px;margin:22px 0}.card,.panel{background:#131920;border:1px solid #27303a;border-radius:12px;padding:18px}.card b{font-size:24px;display:block;margin-top:8px}.panel{margin-top:15px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:11px;border-bottom:1px solid #27303a}button,.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#25303c;color:#e9eef5}.primary{background:#246bfe!important;color:white!important}.danger{background:#61252a!important}.muted{color:#8f9baa}.ok{color:#6ee7a8}.login{max-width:430px;margin:14vh auto;background:#131920;border:1px solid #27303a;padding:28px;border-radius:14px}input,select,textarea{width:100%;background:#0c1117;color:#fff;border:1px solid #34404d;border-radius:8px;padding:10px;margin:6px 0 12px}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center}.modal.on{display:grid}.box{width:min(520px,92vw);background:#151c24;padding:22px;border-radius:14px;border:1px solid #34404d}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:950px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="root"></div><div class="modal" id="modal"><div class="box" id="box"></div></div><script>
const API="https://hc-shop-engine.huycuongonline.workers.dev",STORE="store_amo";let TOKEN=sessionStorage.HC_SHOP_TOKEN||"";
const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n||0))+" đ",esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,opt={}){const h={"x-store-id":STORE,"content-type":"application/json"};if(TOKEN)h.authorization="Bearer "+TOKEN;const r=await fetch(API+p,{...opt,headers:{...h,...opt.headers}});const d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error("Phiên quản trị không hợp lệ")}if(!r.ok)throw Error(d.error||"API error");return d}
function login(){root.innerHTML='<div class="login"><h2>HC Shop Manager</h2><p class="muted">AMO NGUYEN · Store #001</p><label>Mã quản trị</label><input id="tok" type="password" autofocus><button class="primary" onclick="doLogin()">Đăng nhập</button></div>'}
async function doLogin(){TOKEN=tok.value.trim();try{await api("/api/dashboard");sessionStorage.HC_SHOP_TOKEN=TOKEN;app()}catch(e){alert(e.message);TOKEN="";sessionStorage.removeItem("HC_SHOP_TOKEN")}}
function logout(){TOKEN="";sessionStorage.removeItem("HC_SHOP_TOKEN");login()}
function app(){root.innerHTML='<div class="app"><aside class="side"><div class="brand">HC Shop Manager</div><div class="store">AMO NGUYEN<br><small class="muted">Store #001 · Production</small></div><div class="nav">'+[["dashboard","Tổng quan"],["products","Sản phẩm"],["inventory","Kho hàng"],["orders","Đơn hàng"],["customers","Khách hàng"],["promotions","Khuyến mãi"],["reports","Báo cáo"]].map(x=>'<button data-v="'+x[0]+'" onclick="view(\''+x[0]+'\')">'+x[1]+'</button>').join("")+'</div></aside><main class="main"><div class="top"><div><h1 id="title">HC Shop</h1><div class="muted">HC Multi-Shop Engine · Cloudflare D1</div></div><div><a class="btn" href="editor.html">HC Admin</a> <button onclick="logout()">Thoát</button></div></div><div id="content"></div></main></div>';view("dashboard")}
function table(rows,cols,action){return '<div style="overflow:auto"><table><thead><tr>'+cols.map(x=>'<th>'+x[0]+'</th>').join("")+(action?'<th></th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(x=>'<td>'+esc(x[1](r))+'</td>').join("")+(action?'<td>'+action(r)+'</td>':'')+'</tr>').join("")+'</tbody></table></div>'}
function setnav(v,label){title.textContent=label;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
async function view(v){try{
 if(v==="dashboard"){setnav(v,"Tổng quan");const d=await api("/api/dashboard");content.innerHTML='<div class="cards">'+[["Tổng tồn",d.total_stock],["Sắp hết",d.low_stock],["Hết hàng",d.out_stock],["Đơn mới",d.new_orders],["Tổng đơn",d.orders],["Doanh thu",money(d.revenue)]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join("")+'</div><div class="panel"><b class="ok">● Production Online</b><p>Product · Variant/SKU · Inventory · Orders · Customers · Promotions · Reports</p></div>'}
 if(v==="products"){setnav(v,"Sản phẩm");const d=await api("/api/products");content.innerHTML='<div class="panel"><div class="actions"><h3>Product Manager</h3><button class="primary" onclick="productForm()">+ Sản phẩm</button></div>'+table(d.items||[],[["Tên",r=>r.name],["Trạng thái",r=>r.status],["Giá",r=>money(r.price)],["Giá sale",r=>r.sale_price?money(r.sale_price):"—"]],r=>'<button onclick="variantForm(\''+r.id+'\',\''+esc(r.name)+'\')">+ SKU</button> <button class="danger" onclick="archive(\''+r.id+'\')">Ẩn</button>')+'</div>'}
 if(v==="inventory"){setnav(v,"Kho hàng");const d=await api("/api/inventory");content.innerHTML='<div class="panel"><h3>Inventory</h3>'+table(d.items||[],[["SKU",r=>r.sku],["Sản phẩm",r=>r.name],["Size",r=>r.size],["Màu",r=>r.color],["Tồn",r=>r.on_hand],["Giữ",r=>r.reserved],["Có thể bán",r=>r.available]],r=>'<button onclick="stockForm(\''+r.variant_id+'\',\''+r.sku+'\')">Điều chỉnh</button>')+'</div>'}
 if(v==="orders"){setnav(v,"Đơn hàng");const d=await api("/api/orders");content.innerHTML='<div class="panel"><h3>Order Manager</h3>'+table(d.items||[],[["Mã",r=>r.order_no],["Trạng thái",r=>r.status],["Tổng",r=>money(r.total)],["Ngày",r=>r.created_at]],r=>'<button onclick="orderStatus(\''+r.id+'\',\''+r.status+'\')">Cập nhật</button>')+'</div>'}
 if(v==="customers"){setnav(v,"Khách hàng");const d=await api("/api/customers");content.innerHTML='<div class="panel"><h3>Customers</h3>'+table(d.items||[],[["Tên",r=>r.name],["Điện thoại",r=>r.phone],["Email",r=>r.email],["Ngày",r=>r.created_at]])+'</div>'}
 if(v==="promotions"){setnav(v,"Khuyến mãi");const d=await api("/api/promotions");content.innerHTML='<div class="panel"><h3>Promotions</h3>'+table(d.items||[],[["Mã",r=>r.code],["Tên",r=>r.name],["Loại",r=>r.type],["Giá trị",r=>r.value],["Trạng thái",r=>r.active?"Bật":"Tắt"]])+'</div>'}
 if(v==="reports"){setnav(v,"Báo cáo");const d=await api("/api/reports");content.innerHTML='<div class="panel"><h3>Bán chạy</h3>'+table(d.best_sellers||[],[["SKU",r=>r.sku],["Tên",r=>r.name],["SL",r=>r.qty],["Doanh thu",r=>money(r.revenue)]])+'</div><div class="panel"><h3>Lịch sử kho</h3>'+table(d.movements||[],[["Loại",r=>r.type],["SL",r=>r.qty],["Tham chiếu",r=>r.reference_type],["Ngày",r=>r.created_at]])+'</div>'}
 }catch(e){content.innerHTML='<div class="panel">'+esc(e.message)+'</div>'}}
function openBox(x){box.innerHTML=x;modal.classList.add("on")}function closeBox(){modal.classList.remove("on")}
function productForm(){openBox('<h3>Thêm sản phẩm</h3><label>Tên</label><input id="pn"><div class="row"><div><label>Giá</label><input id="pp" type="number"></div><div><label>Giá sale</label><input id="ps" type="number"></div></div><label>Mô tả</label><textarea id="pd"></textarea><label>Trạng thái</label><select id="pst"><option value="active">Đang bán</option><option value="draft">Nháp</option></select><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="saveProduct()">Lưu</button>')}
async function saveProduct(){await api("/api/products",{method:"POST",body:JSON.stringify({name:pn.value,price:+pp.value,sale_price:ps.value?+ps.value:null,description:pd.value,status:pst.value})});closeBox();view("products")}
function variantForm(pid,name){openBox('<h3>Thêm SKU · '+esc(name)+'</h3><input id="vpid" type="hidden" value="'+pid+'"><label>SKU</label><input id="sku"><div class="row"><div><label>Size</label><input id="size"></div><div><label>Màu</label><input id="color"></div></div><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="saveVariant()">Lưu SKU</button>')}
async function saveVariant(){await api("/api/variants",{method:"POST",body:JSON.stringify({product_id:vpid.value,sku:sku.value,size:size.value,color:color.value})});closeBox();view("inventory")}
function stockForm(id,sku){openBox('<h3>Điều chỉnh kho · '+esc(sku)+'</h3><input id="vid" type="hidden" value="'+id+'"><label>Số lượng (+ nhập / - xuất)</label><input id="qty" type="number"><label>Ghi chú</label><input id="note"><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="saveStock()">Cập nhật</button>')}
async function saveStock(){await api("/api/inventory/adjust",{method:"POST",body:JSON.stringify({variant_id:vid.value,qty:+qty.value,note:note.value})});closeBox();view("inventory")}
async function archive(id){if(confirm("Ẩn sản phẩm này?")){await api("/api/products/"+id,{method:"PATCH",body:JSON.stringify({status:"archived"})});view("products")}}
async function orderStatus(id,st){const map={new:["confirmed","cancelled"],confirmed:["packing","cancelled"],packing:["shipping","cancelled"],shipping:["completed","returned"],completed:["returned"]},a=map[st]||[];if(!a.length)return alert("Không còn chuyển trạng thái");const n=prompt("Trạng thái mới: "+a.join(" / "),a[0]);if(n&&a.includes(n)){await api("/api/orders/"+id+"/status",{method:"POST",body:JSON.stringify({status:n})});view("orders")}}
TOKEN?api("/api/dashboard").then(app).catch(login):login();
</script></body></html>
