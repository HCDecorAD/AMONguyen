const API="https://hc-shop-engine.huycuongonline.workers.dev";
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};let STORE=sessionStorage.HC_STORE||LS.get("HC_STORE")||"",TOKEN=sessionStorage.HC_SHOP_TOKEN||LS.get("HC_SHOP_TOKEN")||"",ME=null;
const RANK={viewer:1,staff:2,manager:3,owner:4,super:9};
const rank=()=>RANK[ME?.role]||0,canW=()=>rank()>=2,canMgr=()=>rank()>=3,canOwn=()=>rank()>=4,isSuper=()=>ME?.kind==="super";
const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n||0))+" đ",esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(p,opt={}){const h={"content-type":"application/json"};if(STORE)h["x-store-id"]=STORE;if(TOKEN)h.authorization="Bearer "+TOKEN;const r=await fetch(API+p,{...opt,headers:{...h,...opt.headers}}),d=await r.json().catch(()=>({}));if(r.status===401){if(!ME){throw Error("Mã truy cập không đúng")}if(!canW()||opt.method&&opt.method!=="GET"){throw Error("Bạn không có quyền thực hiện thao tác này")}logout();throw Error("Phiên đăng nhập không hợp lệ")}if(!r.ok)throw Error(d.error||"Lỗi máy chủ ("+r.status+")");return d}
// Ẩn ô "Mã truy cập" trên màn hình đăng nhập. Logic đăng nhập bằng mã vẫn giữ nguyên; đặt true để hiện lại.
const SHOW_ACCESS_CODE=false;
function login(msg){root.innerHTML='<div class="login"><h2>HC Shop Manager</h2><p class="muted">Đăng nhập quản lý cửa hàng</p>'+(msg?'<div class="warn">'+esc(msg)+'</div>':'')+'<label>ID đăng nhập</label><input id="uid" autocomplete="username" autofocus placeholder="Tên đăng nhập được cấp" onkeydown="if(event.key===\'Enter\')doLogin()"><label>Pass</label><input id="upw" type="password" autocomplete="current-password" placeholder="Mật khẩu" onkeydown="if(event.key===\'Enter\')doLogin()">'+(SHOW_ACCESS_CODE?'<p class="muted sm">Hoặc dùng mã truy cập (quản trị viên):</p><label>Mã truy cập</label><input id="tok" type="password" placeholder="mem_… hoặc mã quản trị" onkeydown="if(event.key===\'Enter\')doLogin()">':'')+'<label class="rem"><input type="checkbox" id="rem" checked> Ghi nhớ trên thiết bị này (tự đăng nhập lần sau)</label><button class="primary" onclick="doLogin()">Đăng nhập</button><p class="muted sm">Chỉ bật ghi nhớ trên thiết bị của bạn.</p></div>'}
const HUB_LOGIN="https://hcdecor-hub.huycuongonline.workers.dev/api/shop/login";
const HUB_ERR={invalid_credentials:"Sai ID hoặc Pass, hoặc tài khoản đang bị tạm khóa.",must_change_password:"Hãy đổi Pass trên HUB trước khi vào quản lý cửa hàng.",no_access:"ID này chưa được cấp quyền quản lý cửa hàng AMO."};
async function hubLogin(username,password){const r=await fetch(HUB_LOGIN,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(HUB_ERR[d.error]||"Không đăng nhập được ("+r.status+").");return d.token}
async function doLogin(){const uid=(document.getElementById("uid")?.value||"").trim();const tk=(document.getElementById("tok")?.value||"").trim();if(uid){try{TOKEN=await hubLogin(uid,document.getElementById("upw").value);window.LOGIN_UID=uid}catch(e){login(e.message);return}}else if(tk){TOKEN=tk}else{login(SHOW_ACCESS_CODE?"Nhập ID và Pass, hoặc mã truy cập.":"Nhập ID và Pass.");return}ME=null;try{ME=await api("/api/auth/me");sessionStorage.HC_SHOP_TOKEN=TOKEN;if(ME.kind==="member"){STORE=ME.store.id}sessionStorage.HC_STORE=STORE;if(document.getElementById("rem")?.checked!==false){LS.set("HC_SHOP_TOKEN",TOKEN);LS.set("HC_STORE",STORE)}app()}catch(e){TOKEN="";ME=null;sessionStorage.removeItem("HC_SHOP_TOKEN");LS.del("HC_SHOP_TOKEN");login(e.message)}}
function logout(){TOKEN="";ME=null;window.LOGIN_UID="";STORE="";sessionStorage.removeItem("HC_SHOP_TOKEN");sessionStorage.removeItem("HC_STORE");LS.del("HC_SHOP_TOKEN");LS.del("HC_STORE");login()}
const NAV=[["dashboard","Tổng quan"],["products","Sản phẩm & Media"],["newproduct","Nhập sản phẩm mới"],["inventory","Kho hàng"],["csv","Nhập / Xuất CSV"],["bulk","Sửa hàng loạt"],["orders","Đơn hàng"],["site","Giao diện website"],["customers","Khách hàng"],["stats","Thống kê truy cập"],["promotions","Khuyến mãi"],["reports","Báo cáo"],["team","Thành viên"],["staffhub","Nhân viên ID/Pass"],["account","Tài khoản & bảo mật"],["help","Hướng dẫn"]];
async function app(){
 document.body.classList.toggle("ro",!canW());
 const nav=NAV.filter(x=>(x[0]!=="team"||canMgr())&&(x[0]!=="staffhub"||canMgr())&&(x[0]!=="account"||!isSuper()));
 const storeBox=isSuper()?'<select id="storeSelect" onchange="switchStore(this.value)"></select><button onclick="storeForm()">+ Thêm Store</button>':'<div class="muted sm">'+esc(ME.email||"")+' · '+esc(ME.role)+'</div>';
 root.innerHTML='<button id="menuFab" onclick="toggleMenu()">☰ Menu</button><div class="app"><aside class="side"><div class="brand">HC Shop Manager</div><div class="store"><b id="storeName">Store</b>'+storeBox+'</div><div class="nav">'+nav.map(x=>'<button data-v="'+x[0]+'" onclick="view(\''+x[0]+'\')">'+x[1]+'</button>').join("")+'</div></aside><main class="main"><div class="top"><div><h1 id="title">HC Shop</h1><div class="muted">'+(isSuper()?"Quản trị tổng · tất cả shop":"Cửa hàng của bạn")+(canW()?"":" · chỉ xem")+'</div></div><div><a class="btn" href="shop.html">Website</a> <button onclick="logout()">Thoát</button></div></div><div id="content"></div></main></div>';
 await loadStores();view((location.hash||"")==="#site"?"site":"dashboard")}
async function loadStores(){const d=await api("/api/stores");if(!STORE||!d.items.find(x=>x.id===STORE))STORE=d.items[0]?.id||"";const sel=document.getElementById("storeSelect");if(sel)sel.innerHTML=d.items.map(x=>'<option value="'+x.id+'" '+(x.id===STORE?"selected":"")+'>'+esc(x.name)+' · '+esc(x.code)+'</option>').join("");const x=d.items.find(x=>x.id===STORE);if(x)storeName.textContent=x.name;sessionStorage.HC_STORE=STORE}
async function switchStore(v){STORE=v;sessionStorage.HC_STORE=v;await loadStores();view("dashboard")}
function table(rows,cols,action){return '<div style="overflow:auto"><table><thead><tr>'+cols.map(x=>'<th>'+x[0]+'</th>').join("")+(action?'<th></th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(x=>'<td>'+esc(x[1](r))+'</td>').join("")+(action?'<td>'+action(r)+'</td>':'')+'</tr>').join("")+'</tbody></table></div>'}
function setnav(v,label){title.textContent=label;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
const stPill=s=>'<span class="pill '+({active:"g",draft:"y",archived:"r",committed:"g",approved:"g",dry_run:"y",review:"y",mapped:"y"}[s]||"")+'">'+esc(s)+'</span>';
function toggleMenu(){const o=document.body.classList.toggle("menu-open");const f=document.getElementById("menuFab");if(f)f.textContent=o?"✕ Đóng menu":"☰ Menu"}
function menuClose(){document.body.classList.remove("menu-open");const f=document.getElementById("menuFab");if(f)f.textContent="☰ Menu"}
const HUB_ORIGIN="https://hcdecor-hub.huycuongonline.workers.dev";
function staffHubView(){setnav("staffhub","Nhân viên ID/Pass");act(async()=>{const d=await api("/api/v1/store-users");const users=d.users||[];const note=window.SU_NOTE||"";window.SU_NOTE="";content.innerHTML='<div class="panel"><h3>Nhân viên đăng nhập ID/Pass</h3><p class="muted sm">Tạo ID cho nhân viên (NV) hoặc khách (chỉ xem). Để trống Pass thì hệ thống tự tạo và chỉ hiện một lần. Nhân viên đăng nhập ID/Pass ở trang này và tự đổi Pass được.</p>'+(note?'<div class="warn">'+esc(note)+'</div>':'')+'<div class="tabs"><input id="suU" placeholder="ID đăng nhập"> <select id="suR"><option value="staff">Nhân viên (NV)</option><option value="guest">Khách (chỉ xem)</option></select> <input id="suP" type="password" placeholder="Pass (để trống = tự tạo)" autocomplete="new-password"> <button class="primary" onclick="suCreate()">Tạo ID</button></div></div><div class="panel">'+table(users,[["ID",r=>r.id],["Vai trò",r=>r.role==="staff"?"Nhân viên":"Khách"],["Trạng thái",r=>r.disabled?"Đã khóa":"Hoạt động"]],r=>'<button onclick="suReset(\''+esc(r.id)+'\')">Đặt lại Pass</button> '+(r.disabled?'<button onclick="suLock(\''+esc(r.id)+'\',false)">Mở khóa</button> <button class="danger" onclick="suDelete(\''+esc(r.id)+'\')">Xóa hẳn</button>':'<button onclick="suLock(\''+esc(r.id)+'\',true)">Khóa</button>'))+'</div>'})}
function suCreate(){const u=(document.getElementById("suU").value||"").trim(),p=document.getElementById("suP").value,r=document.getElementById("suR").value;if(!u)return alert("Nhập ID đăng nhập");act(async()=>{const d=await api("/api/v1/store-users",{method:"POST",body:JSON.stringify({action:"create",username:u,role:r,password:p||undefined})});window.SU_NOTE=d.password?"Đã tạo ID "+d.user.id+" · Pass: "+d.password+" (chỉ hiện một lần, hãy gửi cho nhân viên)":"Đã tạo ID "+d.user.id;return staffHubView()})}
function suReset(u){if(confirm("Đặt lại Pass của "+u+"?"))act(async()=>{const p=prompt("Nhập Pass mới (để trống = tự tạo):","")||undefined;const d=await api("/api/v1/store-users",{method:"POST",body:JSON.stringify({action:"reset",username:u,password:p})});window.SU_NOTE="Pass mới của "+u+": "+d.password+" (chỉ hiện một lần)";return staffHubView()})}
function suLock(u,lock){act(async()=>{await api("/api/v1/store-users",{method:"POST",body:JSON.stringify({action:lock?"lock":"unlock",username:u})});return staffHubView()})}
function suDelete(u){if(confirm("Xóa hẳn ID "+u+"? Không hoàn tác được."))act(async()=>{await api("/api/v1/store-users",{method:"POST",body:JSON.stringify({action:"delete",username:u})});window.SU_NOTE="Đã xóa ID "+u;return staffHubView()})}
function pwToggle(id,b){const i=document.getElementById(id);const show=i.type==="password";i.type=show?"text":"password";b.textContent=show?"Ẩn":"Hiện";b.setAttribute("aria-label",show?"Ẩn mật khẩu":"Hiện mật khẩu")}
function pwHint(){const n=document.getElementById("cpN").value||"";const h=document.getElementById("pwHint");h.textContent=n?(n.length<8?"Còn thiếu "+(8-n.length)+" ký tự":"Độ dài hợp lệ"):"";h.style.color=n&&n.length<8?"#ffd479":"#7ee2a8"}

function parseCSV(text){text=String(text||"").replace(/^﻿/,"");const first=text.split(/\r?\n/)[0]||"";const del=[",",";","\t"].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];const rows=[];let row=[],cur="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===del){row.push(cur);cur=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=c}if(cur!==""||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==""))}
const csvCell=v=>{v=String(v??"");return /[",\n\r;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=(head,rows)=>[head,...rows].map(r=>r.map(csvCell).join(",")).join("\r\n");
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const norm=h=>String(h||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const ALIAS={brand:"brand","thuong hieu":"brand",category:"category","danh muc":"category",size:"sizes",sizes:"sizes",color:"colors",colors:"colors",mau:"colors","mau sac":"colors",material:"material","chat lieu":"material",origin:"origin","xuat xu":"origin",badge:"badge",nhan:"badge",tags:"tags",the:"tags",sku:"sku","ma sp":"sku","ma san pham":"sku","ma hang":"sku",name:"name",ten:"name","ten san pham":"name","product name":"name","regular price":"price",price:"price",gia:"price","gia ban":"price","gia goc":"price","sale price":"sale_price","gia sale":"sale_price","gia khuyen mai":"sale_price",stock:"stock","ton kho":"stock","so luong":"stock",qty:"stock",quantity:"stock","on hand":"stock",images:"images",image:"images","hinh anh":"images",anh:"images",description:"description","mo ta":"description",published:"published","dang ban":"published","hien thi":"published"};
const TEMPLATE_HEAD=["Name","Brand","Category","Regular price","Sale price","Size","Color","Stock","Material","Origin","Badge","Images","Description"];
function mapRows(table,mode){const head=(table[0]||[]).map(h=>ALIAS[norm(h)]||null),out=[];for(const r of table.slice(1)){const o={};head.forEach((k,i)=>{if(k&&r[i]!=null&&String(r[i]).trim()!=="")o[k]=String(r[i]).trim()});if(!Object.keys(o).length)continue;if(mode==="products")out.push({sku:o.sku,name:o.name,selling_price:o.price,sale_price:o.sale_price,on_hand:o.stock,images:o.images,description:o.description,published:o.published,brand:o.brand,category:o.category,sizes:o.sizes,colors:o.colors,material:o.material,origin:o.origin,badge:o.badge,tags:o.tags});else if(mode==="price")out.push({sku:o.sku,price:o.price});else out.push({sku:o.sku,qty:o.stock})}return {head,rows:out}}

async function npCompress(file){
  const img=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
  const k=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  let q=0.82,d=c.toDataURL("image/jpeg",q);while(d.length>950000&&q>0.5){q-=0.1;d=c.toDataURL("image/jpeg",q)}
  return d;
}

function loadXLSXLib(){if(window.XLSX)return Promise.resolve(window.XLSX);return new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";sc.onload=()=>ok(window.XLSX);sc.onerror=()=>no(new Error("Không tải được bộ đọc Excel"));document.head.appendChild(sc)})}function csvLoad(f){if(!f)return;if(/\.xlsx?$/i.test(f.name)){const r=new FileReader();r.onload=async()=>{try{const X=await loadXLSXLib();const wb=X.read(r.result,{type:"array"});ctext.value=X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);csvParseText()}catch(e){cprev.innerHTML='<div class="warn">'+esc(e.message)+'</div>'}};r.readAsArrayBuffer(f);return}const r=new FileReader();r.onload=()=>{ctext.value=r.result;csvParseText()};r.readAsText(f,"utf-8")}
function csvParseText(){const t=ctext.value.trim();if(!t){CSVROWS=null;cprev.innerHTML="";return}const tb=parseCSV(t),m=mapRows(tb,cmode.value);CSVROWS=m.rows;const known=m.head.filter(Boolean).length,need=cmode.value==="products"?["name","price"]:cmode.value==="price"?["sku","price"]:["sku","stock"];const miss=need.filter(k=>!m.head.includes(k));let h='<p>Đọc được <b>'+m.rows.length+'</b> dòng, nhận diện <b>'+known+'</b>/'+(tb[0]||[]).length+' cột.</p>';if(miss.length)h+='<div class="warn">Thiếu cột bắt buộc: '+miss.join(", ")+'. Đổi tên cột trong file theo file mẫu.</div>';if(m.rows.length>1000)h+='<div class="warn">Tối đa 1000 dòng mỗi lần nhập. Hãy chia file.</div>';if(m.rows.length){const keys=Object.keys(m.rows[0]).filter(k=>m.rows.some(r=>r[k]!=null));h+=table(m.rows.slice(0,8),keys.map(k=>[k,r=>String(r[k]??"").slice(0,40)]))+(m.rows.length>8?'<p class="muted sm">… và '+(m.rows.length-8)+' dòng nữa</p>':"")}if(cmode.value==="products"&&m.rows.length)h='<p>Đọc được <b>'+m.rows.length+'</b> dòng.</p><p><button class="primary" onclick="csvToGrid()">Đưa vào bảng nhập nhanh để kiểm tra</button></p>';else if(!miss.length&&m.rows.length&&m.rows.length<=1000)h+='<p><button class="primary" onclick="csvRun()">Kiểm tra &amp; nhập '+m.rows.length+' dòng</button></p>';cprev.innerHTML=h}
async function runJob(kind,rows,filename){const j=await api("/api/v1/import-jobs",{method:"POST",body:JSON.stringify({kind,source_type:"csv",filename})});await api("/api/v1/import-jobs/"+j.id+"/stage",{method:"POST",body:JSON.stringify({rows})});const dr=await api("/api/v1/import-jobs/"+j.id+"/dry-run",{method:"POST"});return {id:j.id,summary:dr.summary}}
async function approveCommit(id){if(!canMgr())return false;await api("/api/v1/import-jobs/"+id+"/state",{method:"POST",body:JSON.stringify({to:"review"})});await api("/api/v1/import-jobs/"+id+"/state",{method:"POST",body:JSON.stringify({to:"approved"})});await api("/api/v1/import-jobs/"+id+"/commit",{method:"POST"});return true}
function csvRun(){act(async()=>{if(!CSVROWS?.length)return;const mode=cmode.value;cprev.insertAdjacentHTML("beforeend",'<p class="muted" id="cbusy">Đang kiểm tra dữ liệu…</p>');const r=await runJob(mode,CSVROWS,"import-"+mode+".csv"),s=r.summary;const bad=s.invalid?(await api("/api/v1/import-jobs/"+r.id)).rows.filter(x=>x.status==="invalid").slice(0,20):[];let h='<div class="panel"><p>Kết quả kiểm tra: <span class="pill g">'+s.valid+' hợp lệ</span> '+(s.invalid?'<span class="pill r">'+s.invalid+' lỗi</span>':"")+'</p>';if(bad.length)h+='<div class="warn"><b>Dòng lỗi (sẽ bị bỏ qua):</b><br>'+bad.map(x=>'Dòng '+(x.row_no+1)+': '+esc(JSON.parse(x.errors_json||"[]").join("; "))).join("<br>")+'</div>';if(!s.valid)h+='<p>Không có dòng hợp lệ để nhập.</p>';else if(canMgr())h+='<button class="primary" onclick="csvCommit(\''+r.id+'\')">Xác nhận nhập '+s.valid+' dòng</button> ';else h+='<p class="muted">Đã kiểm tra xong. Quản lý hoặc chủ shop cần bấm "Duyệt &amp; nhập" ở bảng Lịch sử nhập bên dưới.</p>';cprev.innerHTML=h+'</div>';jobsLoad()})}
function csvCommit(id){act(async()=>{await approveCommit(id);cprev.innerHTML='<div class="panel ok">✔ Đã nhập xong. Bạn có thể hoàn tác ở Lịch sử nhập.</div>';CSVROWS=null;ctext.value="";jobsLoad()})}
function jobsLoad(){act(async()=>{const d=await api("/api/v1/import-jobs");jobs.innerHTML=(d.items||[]).length?table(d.items.slice(0,15),[["Thời gian",r=>r.created_at],["Loại",r=>r.kind],["File",r=>r.filename||"—"],["Dòng",r=>{try{const s=JSON.parse(r.summary_json||"{}");return (s.valid??s.committed??s.rows??"")+(s.invalid?" (+"+s.invalid+" lỗi)":"")}catch{return ""}}]],r=>stPill(r.status)+' '+(canMgr()&&["dry_run","review"].includes(r.status)?'<button onclick="csvCommit(\''+r.id+'\')">Duyệt &amp; nhập</button>':"")+(canMgr()&&r.status==="committed"?' <button class="danger" onclick="rollbackJob(\''+r.id+'\')">Hoàn tác</button>':"")):'Chưa có lần nhập nào.'})}
function rollbackJob(id){if(confirm("Hoàn tác lần nhập này? Dữ liệu sẽ trở về trước khi nhập."))act(async()=>{await api("/api/v1/import-jobs/"+id+"/rollback",{method:"POST"});jobsLoad();alert("Đã hoàn tác")})}
async function loadCatalog(){const [p,v,i,m]=await Promise.all([api("/api/products"),api("/api/variants"),api("/api/inventory"),api("/api/images")]);const prod=Object.fromEntries((p.items||[]).map(x=>[x.id,x])),stock={};(i.items||[]).forEach(x=>{stock[x.variant_id]=(stock[x.variant_id]||0)+Number(x.on_hand||0)});const imgs={};(m.items||[]).forEach(x=>(imgs[x.product_id]=imgs[x.product_id]||[]).push(x.url));return (v.items||[]).filter(x=>prod[x.product_id]).map(x=>({sku:x.sku,size:x.size||"",color:x.color||"",variant:x.id,product:prod[x.product_id],price:x.price??prod[x.product_id].price,stock:stock[x.id]??0,images:(imgs[x.product_id]||[])}))}
function exportCSV(){act(async()=>{const rows=await loadCatalog();download("san-pham-"+new Date().toISOString().slice(0,10)+".csv",toCSV(TEMPLATE_HEAD,rows.map(r=>[r.product.name,"","",r.price,r.product.sale_price??"",r.size,r.color,r.stock,r.product.material||"",r.product.origin||"",r.product.badge||"",r.images.join("|"),r.product.description||""])))})}

/* ---------- Bulk edit ---------- */
let BULK=[];
function bulkView(){setnav("bulk","Sửa hàng loạt");act(async()=>{BULK=(await loadCatalog()).map(r=>({...r,np:String(r.price??0),ns:String(r.stock)}));bulkDraw()})}
function bulkDraw(q){const f=(q||"").toLowerCase(),list=BULK.filter(r=>!f||r.sku.toLowerCase().includes(f)||r.product.name.toLowerCase().includes(f));content.innerHTML='<div class="panel"><div class="actions"><h3>Sửa giá &amp; tồn kho ('+BULK.length+' SKU)</h3><input style="max-width:240px;margin:0" placeholder="Tìm SKU / tên…" value="'+esc(q||"")+'" oninput="bulkDraw(this.value)"></div>'+(canW()?'<div class="actions" style="justify-content:flex-start;flex-wrap:wrap;margin:10px 0"><span class="muted sm">Áp cho các dòng đã chọn:</span><input id="bpct" class="cell" type="number" placeholder="% giá"><button onclick="bulkPct()">Tăng/giảm giá %</button><input id="bset" class="cell" type="number" placeholder="Tồn"><button onclick="bulkSet()">Đặt tồn kho</button></div>':"")+'<div style="overflow:auto"><table class="t2"><thead><tr><th><input type="checkbox" onchange="bulkAll(this.checked)"></th><th>SKU</th><th>Sản phẩm</th><th>Giá</th><th>Tồn</th></tr></thead><tbody>'+list.map(r=>{const i=BULK.indexOf(r);return '<tr><td><input type="checkbox" class="bk" data-i="'+i+'"></td><td>'+esc(r.sku)+'</td><td>'+esc(r.product.name)+'</td><td><input class="cell" type="number" min="0" value="'+esc(r.np)+'" '+(canW()?"":"disabled")+' oninput="BULK['+i+'].np=this.value;this.style.outline=Number(this.value)!==Number(BULK['+i+'].price)?\'2px solid #246bfe\':\'\'"></td><td><input class="cell" type="number" min="0" value="'+esc(r.ns)+'" '+(canW()?"":"disabled")+' oninput="BULK['+i+'].ns=this.value;this.style.outline=Number(this.value)!==Number(BULK['+i+'].stock)?\'2px solid #246bfe\':\'\'"></td></tr>'}).join("")+'</tbody></table></div>'+(canW()?'<p><button class="primary" onclick="bulkSave()">Lưu thay đổi</button> <span class="muted sm">Chỉ các ô đã đổi (viền xanh) được gửi đi. Có thể hoàn tác trong Lịch sử nhập.</span></p>':"")+'</div>'}
const bulkSel=()=>[...document.querySelectorAll(".bk:checked")].map(x=>+x.dataset.i);
function bulkAll(on){document.querySelectorAll(".bk").forEach(x=>x.checked=on)}
function bulkPct(){const p=Number(bpct.value);if(!p)return alert("Nhập % (ví dụ 10 hoặc -15)");const s=bulkSel();if(!s.length)return alert("Chưa chọn dòng nào");s.forEach(i=>{BULK[i].np=String(Math.max(0,Math.round(Number(BULK[i].np)*(1+p/100)/1000)*1000))});bulkKeep(s)}
function bulkSet(){if(bset.value==="")return alert("Nhập số tồn");const s=bulkSel();if(!s.length)return alert("Chưa chọn dòng nào");s.forEach(i=>BULK[i].ns=String(Math.max(0,Math.round(Number(bset.value)))));bulkKeep(s)}
function bulkKeep(sel){const q=document.querySelector(".actions input[placeholder^='Tìm']")?.value;bulkDraw(q);sel.forEach(i=>{const c=document.querySelector('.bk[data-i="'+i+'"]');if(c)c.checked=true})}
function bulkSave(){act(async()=>{const price=BULK.filter(r=>Number(r.np)!==Number(r.price)).map(r=>{if(!(Number(r.np)>=0))throw Error("Giá không hợp lệ: "+r.sku);return {sku:r.sku,price:Number(r.np)}}),inv=BULK.filter(r=>Number(r.ns)!==Number(r.stock)).map(r=>{if(!Number.isInteger(Number(r.ns))||Number(r.ns)<0)throw Error("Tồn kho phải là số nguyên ≥ 0: "+r.sku);return {sku:r.sku,qty:Number(r.ns)}});if(!price.length&&!inv.length)return alert("Chưa có thay đổi nào");const jobsRun=[];if(price.length)jobsRun.push(await runJob("price",price,"bulk-price"));if(inv.length)jobsRun.push(await runJob("inventory",inv,"bulk-stock"));let done=0;for(const j of jobsRun){if(j.summary.invalid)throw Error("Có dòng không hợp lệ, chưa lưu. Vui lòng kiểm tra lại số liệu.");if(await approveCommit(j.id))done++}alert(done===jobsRun.length?"Đã lưu "+(price.length+inv.length)+" thay đổi":"Đã gửi "+jobsRun.length+" yêu cầu, chờ quản lý duyệt ở Nhập / Xuất CSV → Lịch sử nhập");bulkView()})}

function promoSave(){act(async()=>{const v=pfs.value;await api("/api/v1/promotions",{method:"POST",body:JSON.stringify({scope:v,code:pfc.value,scope_ref:(v==="product"||v==="category")?pfr.value:undefined,name:pfn.value,percent:pfp.value,min_order:pfm.value,max_discount:pfx.value,max_uses:pfu.value,ends_at:pfe.value?pfe.value+" 23:59:59":""})});closeBox();promoView()})}
function tierForm(){act(async()=>{const d=await api("/api/v1/tiers");window.TR=d.items.map(x=>({...x}));drawTiers()})}
function drawTiers(){openBox('<h3>Hạng khách hàng</h3><p class="muted sm">Hạng đầu tiên phải bắt đầu từ 0 đ. Giảm tối đa 50%.</p>'+TR.map((t,i)=>'<div style="display:grid;grid-template-columns:1fr 1fr 80px 30px;gap:6px;margin:6px 0"><input value="'+esc(t.name)+'" onchange="TR['+i+'].name=this.value"><input type="number" value="'+t.min_spent+'" onchange="TR['+i+'].min_spent=this.value"><input type="number" value="'+t.percent+'" onchange="TR['+i+'].percent=this.value"><button onclick="TR.splice('+i+',1);drawTiers()">×</button></div>').join("")+'<button onclick="TR.push({code:\'\',name:\'Hạng mới\',min_spent:0,percent:0});drawTiers()">+ Thêm hạng</button><br><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="tierSave()">Lưu</button>')}
function tierSave(){act(async()=>{await api("/api/v1/tiers",{method:"POST",body:JSON.stringify({tiers:TR.map(t=>({name:t.name,code:t.code||undefined,min_spent:t.min_spent,percent:t.percent}))})});closeBox();promoView()})}

/* ---------- Team ---------- */
async function teamView(){setnav("team","Thành viên");act(async()=>{const d=await api("/api/v1/members");content.innerHTML='<div class="panel"><div class="actions"><h3>Thành viên cửa hàng</h3>'+(canOwn()?'<button class="primary" onclick="memberForm()">+ Mời thành viên</button>':"")+'</div><p class="muted sm">Mỗi người có một mã truy cập riêng. Vai trò: <b>viewer</b> chỉ xem · <b>staff</b> sửa sản phẩm/kho/đơn · <b>manager</b> duyệt &amp; nhập CSV, hoàn tác · <b>owner</b> quản lý thành viên.</p>'+table(d.items||[],[["Email",r=>r.email],["Tên",r=>r.name||"—"],["Vai trò",r=>r.role],["Trạng thái",r=>r.active?"Hoạt động":"Đã thu hồi"],["Mã kết thúc",r=>r.key_hint?"…"+r.key_hint:"—"],["Đăng nhập cuối",r=>r.last_login_at||"—"]],r=>canOwn()?'<button onclick="memberRotate(\''+r.id+'\')">Cấp mã mới</button> '+(r.active?'<button class="danger" onclick="memberRevoke(\''+r.id+'\')">Thu hồi</button>':""):"")+'</div>'})}
function memberForm(){openBox('<h3>Mời thành viên</h3><label>Email</label><input id="me" type="email"><label>Tên (tuỳ chọn)</label><input id="mn"><label>Vai trò</label><select id="mr"><option value="staff">staff — sửa sản phẩm, kho, đơn</option><option value="viewer">viewer — chỉ xem</option><option value="manager">manager — duyệt &amp; nhập CSV</option><option value="owner">owner — toàn quyền shop</option></select><button onclick="closeBox()">Hủy</button> <button class="primary" onclick="memberSave()">Tạo mã truy cập</button>')}
function showKey(d){openBox('<h3>Mã truy cập</h3><div class="warn">Chỉ hiển thị <b>một lần</b>. Hãy sao chép và gửi riêng cho người dùng.</div><div class="keybox" id="kv">'+esc(d.key)+'</div><button class="primary" onclick="navigator.clipboard?.writeText(document.getElementById(\'kv\').textContent).then(()=>alert(\'Đã sao chép\'))">Sao chép</button> <button onclick="closeBox();view(\'team\')">Xong</button>')}
function memberSave(){act(async()=>{showKey(await api("/api/v1/members",{method:"POST",body:JSON.stringify({email:me.value,name:mn.value,role:mr.value})}))})}
function memberRotate(id){if(confirm("Cấp mã mới? Mã cũ sẽ ngừng hoạt động ngay."))act(async()=>{showKey(await api("/api/v1/members/"+id+"/rotate",{method:"POST"}))})}
function accountView(){setnav("account","Tài khoản & bảo mật");if(ME?.kind!=="member"){content.innerHTML='<div class="panel"><p class="muted">Tài khoản quản trị tổng không có mã thành viên để đổi tại đây.</p></div>';return}
 if(TOKEN&&TOKEN.startsWith("hub1.")){const name=String(ME.email||"").replace(/^user:/,"");content.innerHTML='<div class="acc"><div class="panel acc-head"><div class="av">'+esc(name.charAt(0).toUpperCase())+'</div><div><b>'+esc(name)+'</b><div class="muted sm">Nhân viên cửa hàng AMO</div></div></div><div class="panel"><h3>Đổi mật khẩu</h3><p class="muted sm">Mật khẩu mới ít nhất 8 ký tự và khác mật khẩu cũ. Phiên đăng nhập hiện tại vẫn tiếp tục sau khi đổi.</p><label for="cpC">Mật khẩu hiện tại</label><div class="pw"><input id="cpC" type="password" autocomplete="current-password"><button type="button" class="eye" aria-label="Hiện mật khẩu" onclick="pwToggle(\'cpC\',this)">Hiện</button></div><label for="cpN">Mật khẩu mới</label><div class="pw"><input id="cpN" type="password" autocomplete="new-password" oninput="pwHint()"><button type="button" class="eye" aria-label="Hiện mật khẩu" onclick="pwToggle(\'cpN\',this)">Hiện</button></div><div id="pwHint" class="muted sm hint"></div><label for="cpR">Nhập lại mật khẩu mới</label><div class="pw"><input id="cpR" type="password" autocomplete="new-password"><button type="button" class="eye" aria-label="Hiện mật khẩu" onclick="pwToggle(\'cpR\',this)">Hiện</button></div><div class="acc-actions"><button class="primary" onclick="cpSave()">Đổi mật khẩu</button></div><p id="cpMsg" class="sm" role="status" aria-live="polite"></p></div></div>';return}
 content.innerHTML='<div class="panel"><h3>Tài khoản & bảo mật</h3><p>Email: <b>'+esc(ME.email||"")+'</b><br>Vai trò: <b>'+esc(ME.role||"")+'</b></p><p class="muted sm">Đổi mã truy cập của chính bạn. Mã hiện tại sẽ ngừng hoạt động ngay; phiên đăng nhập này vẫn tiếp tục. Hãy sao chép và lưu mã mới ở nơi an toàn.</p><button class="primary" onclick="accountRotate()">Đổi mã truy cập</button></div>'}
function accountRotate(){if(confirm("Đổi mã truy cập của bạn? Mã hiện tại sẽ ngừng hoạt động ngay."))act(async()=>{const d=await api("/api/v1/me/rotate-key",{method:"POST"});TOKEN=d.key;sessionStorage.HC_SHOP_TOKEN=TOKEN;if(LS.get("HC_SHOP_TOKEN"))LS.set("HC_SHOP_TOKEN",TOKEN);openBox('<h3>Mã truy cập mới</h3><div class="warn">Chỉ hiển thị <b>một lần</b>. Mã cũ đã ngừng hoạt động. Hãy lưu mã mới.</div><div class="keybox" id="kv">'+esc(d.key)+'</div><button class="primary" onclick="navigator.clipboard?.writeText(document.getElementById(\'kv\').textContent).then(()=>alert(\'Đã sao chép\'))">Sao chép</button> <button onclick="closeBox();view(\'account\')">Xong</button>')})}
function memberRevoke(id){if(confirm("Thu hồi quyền truy cập của người này?"))act(async()=>{await api("/api/v1/members/"+id+"/revoke",{method:"POST"});teamView()})}

if(TOKEN)api("/api/auth/me").then(m=>{ME=m;if(m.kind==="member")STORE=m.store.id;return app()}).catch(()=>login());else login();
</script></body></html>
