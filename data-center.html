<!doctype html><html lang="vi"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMO Data Center Import</title><style>*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#0b0e12;color:#eef2f7}.wrap{max-width:1200px;margin:auto;padding:32px}.panel{background:#131920;border:1px solid #27303a;border-radius:12px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,button{padding:11px;border-radius:8px;border:1px solid #34404d;background:#0c1117;color:#fff}button{cursor:pointer;background:#246bfe;border:0}button:disabled{opacity:.4}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #27303a;text-align:left}.bad{color:#ff8e8e}.ok{color:#71e6a4}.muted{color:#91a0b2}</style></head><body><main class="wrap"><h1>AMO Data Center · Catalog Import</h1><p class="muted">CSV → Preview → Validate → Admin Commit. Không tự tạo tồn kho nếu dữ liệu thiếu.</p><section class="panel row"><div><label>CSV catalog</label><br><input id="file" type="file" accept=".csv,text/csv"></div><div><label>Admin token (chỉ cần khi commit)</label><br><input id="token" type="password" placeholder="Không lưu token"></div></section><section class="panel"><b>Schema bắt buộc</b><p>name, price, sku, size, stock. Tuỳ chọn: sale_price, description, color, image_url, status.</p><p id="status">Chưa có file.</p></section><section class="panel" style="overflow:auto"><table><thead><tr><th>#</th><th>Name</th><th>Price</th><th>SKU</th><th>Size</th><th>Stock</th><th>Validation</th></tr></thead><tbody id="rows"></tbody></table></section><button id="commit" disabled>COMMIT CATALOG</button><p id="result"></p></main><script>
const API="https://hc-shop-engine.huycuongonline.workers.dev",STORE="store_amo";let data=[];
function parseCSV(t){let ls=t.replace(/\r/g,"").split("\n").filter(Boolean),h=ls.shift().split(",").map(x=>x.trim());return ls.map(l=>{let v=l.split(",");return Object.fromEntries(h.map((k,i)=>[k,(v[i]||"").trim()]))})}
function valid(x){let e=[];if(!x.name)e.push("name");if(!(Number(x.price)>0))e.push("price");if(!x.sku)e.push("sku");if(!x.size)e.push("size");if(!Number.isFinite(Number(x.stock))||Number(x.stock)<0)e.push("stock");return e}
function render(){let errors=0;rows.replaceChildren();data.forEach((x,i)=>{let e=valid(x);errors+=!!e.length;const tr=document.createElement("tr");[i+1,x.name,x.price,x.sku,x.size,x.stock,e.length?"Thiếu/sai: "+e.join(", "):"OK"].forEach((v,j)=>{const td=document.createElement("td");td.textContent=String(v??"");if(j===6)td.className=e.length?"bad":"ok";tr.appendChild(td)});rows.appendChild(tr)});status.textContent=data.length+" dòng · "+errors+" lỗi";commit.disabled=!data.length||errors>0}
file.onchange=async()=>{data=parseCSV(await file.files[0].text());render()};
async function api(p,opt={}){let r=await fetch(API+p,{...opt,headers:{"content-type":"application/json","x-store-id":STORE,"authorization":"Bearer "+token.value.trim()}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"API "+r.status);return j}
commit.onclick=async()=>{if(!token.value.trim())return result.textContent="Cần admin token để commit.";if(!confirm("Commit "+data.length+" dòng hợp lệ vào store_amo?"))return;commit.disabled=true;let ok=0;try{for(const x of data){let p=await api("/api/products",{method:"POST",body:JSON.stringify({name:x.name,price:+x.price,sale_price:x.sale_price?+x.sale_price:null,description:x.description||"",status:x.status||"active"})});let v=await api("/api/variants",{method:"POST",body:JSON.stringify({product_id:p.id,sku:x.sku,size:x.size,color:x.color||""})});if(+x.stock)await api("/api/inventory/adjust",{method:"POST",body:JSON.stringify({variant_id:v.id,qty:+x.stock,note:"CSV initial import"})});if(x.image_url)await api("/api/images",{method:"POST",body:JSON.stringify({product_id:p.id,url:x.image_url,alt:x.name,sort_order:0})});ok++}result.textContent="Đã import "+ok+" dòng.";data=[];render()}catch(e){result.textContent="Dừng tại dòng "+(ok+1)+": "+e.message}finally{commit.disabled=false}};
</script></body></html>
