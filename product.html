<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMO NGUYEN | Sản phẩm</title><link rel="stylesheet" href="css/amo-style.css"><link rel="stylesheet" href="css/amo-responsive.css"><style>
.pd{display:grid;grid-template-columns:1.15fr .85fr;gap:5vw;padding:7rem 5% 5rem;max-width:1400px;margin:auto}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.info{position:sticky;top:100px;height:max-content}.price{font-size:1.35rem;margin:1.3rem 0}.opts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}.opt{border:1px solid #bbb;background:#fff;padding:10px 15px;cursor:pointer}.opt.on{border-color:#111;background:#111;color:#fff}.opt:disabled{opacity:.35}.qty{width:80px;padding:10px}.buy{width:100%;padding:15px;border:0;background:#111;color:#fff;margin-top:12px;cursor:pointer}.back{display:inline-block;margin-bottom:24px;color:inherit}.msg{margin-top:12px}.cartlink{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;padding:12px 18px;text-decoration:none;z-index:5}@media(max-width:800px){.pd{grid-template-columns:1fr;padding-top:5rem}.gallery{grid-template-columns:1fr}.info{position:static}}</style></head><body><main class="pd"><section><a class="back" href="shop.html">← Bộ sưu tập</a><div class="gallery" id="gallery"></div></section><section class="info"><div class="amo-caption">AMO NGUYEN</div><h1 class="amo-h1" id="name">Đang tải…</h1><div class="price" id="price"></div><p id="desc"></p><div class="amo-caption">CHỌN SIZE / PHIÊN BẢN</div><div class="opts" id="opts"></div><label>Số lượng</label><input class="qty" id="qty" type="number" min="1" max="20" value="1"><button class="buy" id="add">THÊM VÀO GIỎ</button><div class="msg" id="msg"></div></section></main><a class="cartlink" href="cart.html">GIỎ HÀNG · <span id="count">0</span></a><script>
const API="https://hc-shop-engine.huycuongonline.workers.dev",STORE="store_amo",key=new URLSearchParams(location.search).get("p");let product,selected;
const validPrice=n=>Number.isFinite(Number(n))&&Number(n)>0,money=n=>new Intl.NumberFormat("vi-VN").format(Number(n))+" đ",cart=()=>{try{const x=JSON.parse(localStorage.AMO_CART||"[]");return Array.isArray(x)?x:[]}catch{return[]}},save=x=>{localStorage.AMO_CART=JSON.stringify(x);count.textContent=x.reduce((a,b)=>a+(Number(b.qty)||0),0)};
async function init(){save(cart());if(!key){name.textContent="Không tìm thấy sản phẩm";add.disabled=true;return}try{const r=await fetch(API+"/api/catalog/"+encodeURIComponent(key),{headers:{"x-store-id":STORE}});if(!r.ok)throw Error("not-found");product=await r.json();name.textContent=product.name||"Sản phẩm AMO";desc.textContent=product.description||"";const basePrice=product.sale_price??product.price;price.textContent=validPrice(basePrice)?money(basePrice):"Liên hệ AMO để được tư vấn";const imgs=Array.isArray(product.images)?product.images.filter(x=>x&&x.url):[];gallery.replaceChildren();if(imgs.length){imgs.forEach(x=>{const im=document.createElement("img");im.src=x.url;im.alt=x.alt||product.name||"Sản phẩm AMO";im.loading="lazy";gallery.appendChild(im)})}else{const ph=document.createElement("div");ph.textContent="Hình ảnh sản phẩm đang được cập nhật.";ph.style.cssText="padding:4rem 1rem;text-align:center;background:#f3efe6";gallery.appendChild(ph)}const variants=Array.isArray(product.variants)?product.variants:[];opts.replaceChildren();variants.forEach(v=>{const b=document.createElement("button");b.className="opt";b.dataset.id=String(v.id);b.disabled=Number(v.available)<=0;b.textContent=[v.size||v.sku,v.color,Number(v.available)>0?"Còn "+Number(v.available):"Tạm hết"].filter(Boolean).join(" · ");opts.appendChild(b)});if(!variants.length){add.disabled=true;msg.textContent="Vui lòng liên hệ AMO để được tư vấn tình trạng hàng."}opts.onclick=e=>{const b=e.target.closest(".opt");if(!b)return;selected=variants.find(v=>String(v.id)===b.dataset.id);if(!selected)return;opts.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===b));const p=selected.sale_price??selected.price??basePrice;price.textContent=validPrice(p)?money(p):"Liên hệ AMO để được tư vấn"};add.onclick=()=>{if(!selected)return msg.textContent="Vui lòng chọn size / phiên bản.";const itemPrice=selected.sale_price??selected.price??basePrice;if(!validPrice(itemPrice))return msg.textContent="Giá sản phẩm đang được xác nhận. Vui lòng liên hệ AMO.";const available=Math.max(0,Number(selected.available)||0),q=Math.max(1,Math.min(20,Number(qty.value)||1));if(q>available)return msg.textContent="Số lượng vượt tồn kho.";let c=cart(),x=c.find(x=>x.variant_id===selected.id);if(x)x.qty=Math.min(available,Number(x.qty||0)+q);else c.push({variant_id:selected.id,product_id:product.id,name:product.name,sku:selected.sku,size:selected.size,color:selected.color,price:itemPrice,image:imgs[0]?.url||"",qty:q});save(c);msg.textContent="Đã thêm vào giỏ hàng."}}catch(e){name.textContent="Sản phẩm không khả dụng";desc.textContent="Vui lòng quay lại Shop hoặc liên hệ AMO NGUYỄN để được tư vấn.";price.textContent="";add.disabled=true}}
init();
</script><script src="js/amo-theme.js" defer></script></body></html>
