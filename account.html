<!doctype html><html lang="vi"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My AMO | AMO NGUYEN</title><meta name="description" content="My AMO: size giày, wishlist và thông tin mua sắm cá nhân."><link rel="stylesheet" href="css/amo-style.css"><style>.my{max-width:1050px;margin:auto;padding:7rem 5%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #ddd;padding:22px}.card input{width:100%;padding:11px;margin:7px 0;border:1px solid #ccc}.btn{background:#111;color:#fff;border:0;padding:11px 15px;cursor:pointer}.muted{color:#777}@media(max-width:760px){.cards{grid-template-columns:1fr}}</style></head><body><main class="my"><a href="shop.html">← Shop</a><p class="amo-caption">CLIENT PROFILE</p><h1 class="amo-h1">MY AMO</h1><p class="muted">Foundation lưu cục bộ trên thiết bị. Đơn hàng production sẽ chỉ hiển thị sau khi có xác thực khách hàng.</p><div class="cards"><section class="card"><h2>My Sizes</h2><label>Chiều dài chân (cm)</label><input id="cm" inputmode="decimal"><label>EU thường mang</label><input id="eu"><label>Thương hiệu / size tham chiếu</label><input id="brand"><button class="btn" id="save">Lưu size</button><p id="msg"></p></section><section class="card"><h2>Wishlist</h2><p id="wish">Chưa có sản phẩm yêu thích.</p><a href="shop.html">Khám phá sản phẩm →</a></section><section class="card"><h2>Private Requests</h2><p>Gửi model, size, màu hoặc ảnh đôi giày bạn đang tìm.</p><a href="contact.html">Hỏi AMO Advisor →</a></section></div></main><script>let p=JSON.parse(localStorage.AMO_PROFILE||"{}");cm.value=p.cm||"";eu.value=p.eu||"";brand.value=p.brand||"";save.onclick=()=>{localStorage.AMO_PROFILE=JSON.stringify({cm:cm.value.trim(),eu:eu.value.trim(),brand:brand.value.trim()});msg.textContent="Đã lưu trên thiết bị này."};let w=JSON.parse(localStorage.AMO_WISHLIST||"[]");wish.textContent=w.length?w.length+" sản phẩm đã lưu.":"Chưa có sản phẩm yêu thích.";</script></body></html>
