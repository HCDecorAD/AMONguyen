settings:
  content: { merge: true }
  commit: { identity: user }
media:
  input: assets/images
  output: /assets/images
  rename: safe
  categories: [image]
content:
  - name: home
    label: "Trang chu"
    type: file
    path: config/home.json
    format: json
    operations: { delete: false }
    fields:
      - name: hero
        label: "Hero"
        type: object
        fields:
          - { name: eyebrow, label: "Dong nho", type: string }
          - { name: title, label: "Tieu de", type: string }
          - { name: lead, label: "Mo ta", type: text }
          - { name: image, label: "Anh nen", type: image }
          - { name: primaryLabel, label: "Nut chinh", type: string }
          - { name: secondaryLabel, label: "Nut phu", type: string }
      - name: editorial
        label: "Editorial"
        type: object
        fields:
          - { name: kicker, label: "Dong nho", type: string }
          - { name: title, label: "Tieu de", type: string }
          - { name: text, label: "Noi dung", type: text }
          - { name: image, label: "Hinh anh", type: image }
      - name: styles
        label: "Danh muc noi bat"
        type: object
        list: { min: 1, max: 12, collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: title, label: "Ten", type: string }
          - { name: subtitle, label: "Mo ta", type: string }
          - { name: image, label: "Hinh anh", type: image }
          - { name: url, label: "Lien ket", type: string }
  - name: layout
    label: "Bo cuc trang chu"
    type: file
    path: config/layout.json
    format: json
    operations: { delete: false }
    fields:
      - name: sections
        label: "Section"
        type: object
        list: { min: 1, max: 12, collapsible: { collapsed: false, summary: "{label}" } }
        fields:
          - { name: selector, label: "Selector ky thuat", type: string, readonly: true }
          - { name: label, label: "Ten section", type: string }
          - { name: enabled, label: "Hien thi", type: boolean }
          - { name: order, label: "Thu tu", type: number }