<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | AMO NGUYEN</title><link rel="stylesheet" href="css/amo-style.css"><style>.wrap{max-width:1100px;margin:auto;padding:7rem 5%;display:grid;grid-template-columns:1fr .8fr;gap:6vw}.field{margin:12px 0}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ccc;background:#fff}.sum{background:#f4f2ee;padding:25px;height:max-content}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px 0}.btn{width:100%;background:#111;color:#fff;border:0;padding:15px;margin-top:20px;cursor:pointer}.done{text-align:center;padding:80px 10px}@media(max-width:760px){.wrap{grid-template-columns:1fr}}</style></head><body><main class="wrap" id="wrap"><section><a href="cart.html">← Giỏ hàng</a><h1 class="amo-h1">CHECKOUT</h1><div class="field"><label>Họ và tên *</label><input id="name"></div><div class="field"><label>Số điện thoại *</label><input id="phone" inputmode="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Địa chỉ giao hàng *</label><textarea id="address" rows="3"></textarea></div><div class="field"><label>Thanh toán</label><p>Phương thức thanh toán sẽ được AMO xác nhận trực tiếp khi liên hệ.</p></div><div class="field"><label>Ghi chú</label><textarea id="note" rows="2"></textarea></div></section><aside class="sum"><h3>ĐƠN HÀNG</h3><div id="items"></div><div class="row"><b>Tổng cộng</b><b id="total"></b></div><button class="btn" id="place">ĐẶT HÀNG</button><p id="msg"></p></aside></main><script>
const valid=x=>x&&String(x.variant_id||"").trim()&&Number.isFinite(Number(x.price))&&Number(x.price)>0&&Number.isFinite(Number(x.qty))&&Number(x.qty)>0;let c=[];try{c=JSON.parse(localStorage.AMO_CART||"[]");if(!Array.isArray(c))c=[]}catch{c=[]}const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n||0))+" đ";c=c.filter(valid);if(!c.length)location.href="cart.html";else localStorage.AMO_CART=JSON.stringify(c);const itemsEl=document.getElementById("items"),totalEl=document.getElementById("total"),placeEl=document.getElementById("place"),msgEl=document.getElementById("msg");itemsEl.replaceChildren();c.forEach(x=>{const r=document.createElement("div");r.className="row";const a=document.createElement("span"),b=document.createElement("span");a.textContent=(x.name||"Sản phẩm AMO")+" · "+(x.size||x.sku||"")+" × "+Number(x.qty||0);b.textContent=money(Number(x.price||0)*Number(x.qty||0));r.append(a,b);itemsEl.appendChild(r)});totalEl.textContent=money(c.reduce((a,x)=>a+Number(x.price)*Number(x.qty),0));placeEl.textContent="LIÊN HỆ XÁC NHẬN ĐƠN";placeEl.onclick=()=>{const n=document.getElementById("name").value.trim(),p=document.getElementById("phone").value.replace(/\\s+/g,"").trim(),a=document.getElementById("address").value.trim();if(n.length<2)return msgEl.textContent="Vui lòng nhập họ tên hợp lệ.";if(!/^(?:\\+84|0)\\d{9,10}$/.test(p))return msgEl.textContent="Số điện thoại chưa đúng định dạng.";if(a.length<8)return msgEl.textContent="Vui lòng nhập địa chỉ giao hàng đầy đủ.";const lines=c.map(x=>(x.name||"AMO")+" / "+(x.sku||x.size||"")+" x"+x.qty+" — "+money(x.price*x.qty));const summary="AMO NGUYEN - YÊU CẦU XÁC NHẬN ĐƠN\\n"+lines.join("\\n")+"\\nTổng tạm tính: "+totalEl.textContent+"\\nKhách: "+n+" / "+p+"\\nĐịa chỉ: "+a+"\\nGhi chú: "+document.getElementById("note").value.trim();navigator.clipboard?.writeText(summary).catch(()=>{});msgEl.textContent="Đây là yêu cầu xác nhận, chưa tạo đơn WooCommerce. Nội dung đã được sao chép nếu trình duyệt cho phép. Vui lòng gửi cho AMO qua Zalo.";const a1=document.createElement("a");a1.href="https://zalo.me/0932680592";a1.target="_blank";a1.rel="noopener noreferrer";a1.textContent="Mở Zalo AMO để gửi yêu cầu";msgEl.append(" ",a1)};</script><script src="js/amo-theme.js" defer></script></body></html>
