<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | AMO NGUYEN</title><link rel="stylesheet" href="css/amo-style.css"><style>.wrap{max-width:1100px;margin:auto;padding:7rem 5%;display:grid;grid-template-columns:1fr .8fr;gap:6vw}.field{margin:12px 0}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ccc;background:#fff}.sum{background:#f4f2ee;padding:25px;height:max-content}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px 0}.btn{width:100%;background:#111;color:#fff;border:0;padding:15px;margin-top:20px;cursor:pointer}.done{text-align:center;padding:80px 10px}@media(max-width:760px){.wrap{grid-template-columns:1fr}}</style><link rel="stylesheet" href="css/amo-localwp.css"></head><body><main class="wrap" id="wrap"><section><a href="cart.html">← Giỏ hàng</a><h1 class="amo-h1">CHECKOUT</h1><div class="field"><label>Họ và tên *</label><input id="name"></div><div class="field"><label>Số điện thoại *</label><input id="phone" inputmode="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Địa chỉ giao hàng *</label><textarea id="address" rows="3"></textarea></div><div class="field"><label>Thanh toán</label><p>Phương thức thanh toán sẽ được AMO xác nhận trực tiếp khi liên hệ.</p></div><div class="field"><label>Ghi chú</label><textarea id="note" rows="2"></textarea></div></section><aside class="sum"><h3>ĐƠN HÀNG</h3><div id="items"></div><div class="row"><b>Tổng cộng</b><b id="total"></b></div><button class="btn" id="place">ĐẶT HÀNG</button><p id="msg"></p></aside></main><script>
(function(){
var ENGINE="https://hc-shop-engine.huycuongonline.workers.dev",STORE="store_amo";
var $=function(i){return document.getElementById(i)};
var money=function(n){return new Intl.NumberFormat("vi-VN").format(Number(n||0))+" đ"};
var c=[];try{c=JSON.parse(localStorage.AMO_CART||"[]");if(!Array.isArray(c))c=[]}catch(e){c=[]}
c=c.filter(function(x){return x&&String(x.variant_id||"").trim()&&Number(x.price)>0&&Number(x.qty)>0});
if(!c.length){location.href="cart.html";return}
var itemsEl=$("items"),totalEl=$("total"),placeEl=$("place"),msgEl=$("msg");
var sub=c.reduce(function(a,x){return a+Number(x.price)*Number(x.qty)},0),disc=0,code="";
function row(l,r,bold){var d=document.createElement("div");d.className="row";var a=document.createElement(bold?"b":"span"),b=document.createElement(bold?"b":"span");a.textContent=l;b.textContent=r;d.append(a,b);return d}
function draw(){itemsEl.replaceChildren();c.forEach(function(x){itemsEl.appendChild(row((x.name||"Sản phẩm AMO")+" · "+(x.size||x.sku||"")+" × "+Number(x.qty),money(Number(x.price)*Number(x.qty))))});
 if(disc>0)itemsEl.appendChild(row("Giảm giá"+(code?" ("+code+")":""),"- "+money(disc)));
 totalEl.textContent=money(Math.max(0,sub-disc))}
draw();
var f=document.createElement("div");f.className="field";f.innerHTML='<label>Mã giảm giá</label><div style="display:flex;gap:8px"><input id="coupon" placeholder="Nhập mã nếu có" style="flex:1"><button type="button" class="btn" id="cpApply" style="width:auto;padding:0 16px">Áp dụng</button></div><p id="cpMsg" style="margin:6px 0 0;font-size:13px"></p>';
var note=$("note");note.closest(".field").before(f);
$("cpApply").onclick=function(){var v=$("coupon").value.trim(),m=$("cpMsg");if(!v){code="";disc=0;m.textContent="";draw();return}
 m.textContent="Đang kiểm tra...";
 fetch(ENGINE+"/api/c/coupon?store="+STORE+"&code="+encodeURIComponent(v)+"&subtotal="+sub).then(function(r){return r.json()}).then(function(d){
  if(d&&d.discount>0){disc=d.discount;code=v.toUpperCase();m.textContent="Đã áp dụng mã, giảm "+money(disc)}else{disc=0;code="";m.textContent=(d&&d.coupon_error)||"Mã không hợp lệ hoặc chưa đủ điều kiện."}draw()
 }).catch(function(){m.textContent="Không kiểm tra được mã lúc này."})};
var busy=false;
placeEl.textContent="ĐẶT HÀNG";
placeEl.onclick=function(){
 if(busy)return;
 if(c.some(function(x){return x.demo})){msgEl.textContent="Giỏ có sản phẩm mẫu nên chưa thể đặt hàng. Vui lòng chọn sản phẩm thật hoặc liên hệ AMO.";return}
 var name=$("name").value.trim(),phone=$("phone").value.trim(),address=$("address").value.trim();
 if(!name||!phone||!address){msgEl.textContent="Vui lòng nhập họ tên, số điện thoại và địa chỉ giao hàng.";return}
 if(!/^[0-9+\s.()-]{8,15}$/.test(phone)){msgEl.textContent="Số điện thoại chưa đúng.";return}
 busy=true;placeEl.disabled=true;msgEl.textContent="Đang gửi đơn hàng...";
 var body={items:c.map(function(x){return{variant_id:x.variant_id,qty:Math.trunc(Number(x.qty))}}),customer:{name:name,phone:phone,email:$("email").value.trim(),address:address},note:$("note").value.trim(),payment_method:"cod"};
 if(code)body.coupon=code;
 fetch(ENGINE+"/api/orders?store="+STORE,{method:"POST",headers:{"content-type":"application/json","x-store-id":STORE},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(o){
  if(!o.ok||!o.d.ok)throw new Error((o.d&&o.d.error)||"Không tạo được đơn");
  try{localStorage.removeItem("AMO_CART")}catch(e){}
  var w=$("wrap");w.replaceChildren();var s=document.createElement("section");s.style.gridColumn="1/-1";s.style.textAlign="center";s.style.padding="40px 0";
  var h=document.createElement("h1");h.className="amo-h1";h.textContent="ĐẶT HÀNG THÀNH CÔNG";
  var p1=document.createElement("p");p1.textContent="Mã đơn: "+o.d.order_no;p1.style.fontSize="20px";
  var p2=document.createElement("p");p2.textContent="Tổng thanh toán: "+money(o.d.total)+(o.d.discount>0?" (đã giảm "+money(o.d.discount)+")":"");
  var p3=document.createElement("p");p3.textContent="AMO sẽ liên hệ xác nhận đơn và giao hàng qua số "+phone+". Cảm ơn anh/chị đã mua hàng.";
  var a=document.createElement("a");a.href="shop.html";a.textContent="Tiếp tục xem sản phẩm";a.className="btn";a.style.display="inline-block";a.style.marginTop="14px";
  s.append(h,p1,p2,p3,a);w.appendChild(s);scrollTo(0,0);
 }).catch(function(e){busy=false;placeEl.disabled=false;var m=String(e.message||"");msgEl.textContent=/stock/i.test(m)?"Một sản phẩm không đủ tồn kho. Vui lòng giảm số lượng hoặc chọn size khác.":/variant/i.test(m)?"Sản phẩm trong giỏ không còn bán. Vui lòng chọn lại.":"Chưa gửi được đơn: "+m})
};
})();
</script><script src="js/amo-theme.js" defer></script><script src="js/amo-localwp.js" defer></script></body></html>
