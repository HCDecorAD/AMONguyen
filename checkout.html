<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | AMO NGUYEN</title><link rel="stylesheet" href="css/amo-style.css"><style>.wrap{max-width:1100px;margin:auto;padding:7rem 5%;display:grid;grid-template-columns:1fr .8fr;gap:6vw}.field{margin:12px 0}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ccc;background:#fff}.sum{background:#f4f2ee;padding:25px;height:max-content}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px 0}.btn{width:100%;background:#111;color:#fff;border:0;padding:15px;margin-top:20px;cursor:pointer}.done{text-align:center;padding:80px 10px}@media(max-width:760px){.wrap{grid-template-columns:1fr}}</style></head><body><main class="wrap" id="wrap"><section><a href="cart.html">← Giỏ hàng</a><h1 class="amo-h1">CHECKOUT</h1><div class="field"><label>Họ và tên *</label><input id="name"></div><div class="field"><label>Số điện thoại *</label><input id="phone" inputmode="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Địa chỉ giao hàng *</label><textarea id="address" rows="3"></textarea></div><div class="field"><label>Thanh toán</label><select id="payment"><option value="cod">Thanh toán khi nhận hàng (COD)</option></select></div><div class="field"><label>Ghi chú</label><textarea id="note" rows="2"></textarea></div></section><aside class="sum"><h3>ĐƠN HÀNG</h3><div id="items"></div><div class="row"><b>Tổng cộng</b><b id="total"></b></div><button class="btn" id="place">ĐẶT HÀNG</button><p id="msg"></p></aside></main><script>
const API="https://hc-shop-engine.huycuongonline.workers.dev",STORE="store_amo",c=JSON.parse(localStorage.AMO_CART||"[]"),money=n=>new Intl.NumberFormat("vi-VN").format(Number(n||0))+" đ";if(!c.length)location.href="cart.html";items.innerHTML=c.map(x=>'<div class="row"><span>'+x.name+' · '+(x.size||x.sku)+' × '+x.qty+'</span><span>'+money(x.price*x.qty)+'</span></div>').join("");total.textContent=money(c.reduce((a,x)=>a+x.price*x.qty,0));place.onclick=async()=>{if(!name.value.trim()||!phone.value.trim()||!address.value.trim())return msg.textContent="Vui lòng nhập họ tên, số điện thoại và địa chỉ.";place.disabled=true;msg.textContent="Đang tạo đơn…";try{const r=await fetch(API+"/api/orders",{method:"POST",headers:{"content-type":"application/json","x-store-id":STORE},body:JSON.stringify({customer:{name:name.value,phone:phone.value,email:email.value,address:address.value},payment_method:payment.value,note:note.value,items:c.map(x=>({variant_id:x.variant_id,qty:x.qty}))})}),d=await r.json();if(!r.ok)throw Error(d.error||"Không thể tạo đơn");localStorage.removeItem("AMO_CART");wrap.innerHTML='<div class="done" style="grid-column:1/-1"><h1>ĐẶT HÀNG THÀNH CÔNG</h1><p>Mã đơn: <b>'+d.order_no+'</b></p><p>Tổng: '+money(d.total)+'</p><a href="shop.html">Tiếp tục xem bộ sưu tập</a></div>'}catch(e){msg.textContent=e.message;place.disabled=false}};
</script></body></html>
