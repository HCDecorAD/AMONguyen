<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | AMO NGUYEN</title><link rel="stylesheet" href="css/amo-style.css"><style>.wrap{max-width:1100px;margin:auto;padding:7rem 5%;display:grid;grid-template-columns:1fr .8fr;gap:6vw}.field{margin:12px 0}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ccc;background:#fff}.sum{background:#f4f2ee;padding:25px;height:max-content}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px 0}.btn{width:100%;background:#111;color:#fff;border:0;padding:15px;margin-top:20px;cursor:pointer}.done{text-align:center;padding:80px 10px}@media(max-width:760px){.wrap{grid-template-columns:1fr}}</style></head><body><main class="wrap" id="wrap"><section><a href="cart.html">← Giỏ hàng</a><h1 class="amo-h1">CHECKOUT</h1><div class="field"><label>Họ và tên *</label><input id="name"></div><div class="field"><label>Số điện thoại *</label><input id="phone" inputmode="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Địa chỉ giao hàng *</label><textarea id="address" rows="3"></textarea></div><div class="field"><label>Thanh toán</label><p>Phương thức thanh toán sẽ được AMO xác nhận trực tiếp khi liên hệ.</p></div><div class="field"><label>Ghi chú</label><textarea id="note" rows="2"></textarea></div></section><aside class="sum"><h3>ĐƠN HÀNG</h3><div id="items"></div><div class="row"><b>Tổng cộng</b><b id="total"></b></div><button class="btn" id="place">ĐẶT HÀNG</button><p id="msg"></p></aside></main><script>
const API="https://hc-shop-engine.huycuongonline.workers.dev",STORE="store_amo";let c=[];try{c=JSON.parse(localStorage.AMO_CART||"[]");if(!Array.isArray(c))c=[]}catch(e){c=[]}const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n||0))+" đ";if(!c.length)location.href="cart.html";items.replaceChildren();c.forEach(x=>{const r=document.createElement("div");r.className="row";const a=document.createElement("span"),b=document.createElement("span");a.textContent=(x.name||"Sản phẩm AMO")+" · "+(x.size||x.sku||"")+" × "+Number(x.qty||0);b.textContent=money(Number(x.price||0)*Number(x.qty||0));r.append(a,b);items.appendChild(r)});total.textContent=money(c.reduce((a,x)=>a+x.price*x.qty,0));let submitting=false;place.onclick=async()=>{if(submitting)return;const n=name.value.trim(),p=phone.value.replace(/\s+/g,"").trim(),a=address.value.trim(),em=email.value.trim();if(n.length<2)return msg.textContent="Vui lòng nhập họ tên hợp lệ.";if(!/^(?:\+84|0)\d{9,10}$/.test(p))return msg.textContent="Số điện thoại chưa đúng định dạng.";if(a.length<8)return msg.textContent="Vui lòng nhập địa chỉ giao hàng đầy đủ.";if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return msg.textContent="Email chưa đúng định dạng.";submitting=true;place.disabled=true;msg.textContent="Đang tạo đơn…";try{const r=await fetch(API+"/api/orders",{method:"POST",headers:{"content-type":"application/json","x-store-id":STORE},body:JSON.stringify({customer:{name:n,phone:p,email:em,address:a},note:note.value.trim(),items:c.map(x=>({variant_id:x.variant_id,qty:x.qty}))})}),d=await r.json();if(!r.ok)throw Error(d.error||"Không thể tạo đơn");localStorage.AMO_LAST_ORDER=JSON.stringify({order_no:d.order_no,total:d.total,created_at:new Date().toISOString(),phone:p});localStorage.removeItem("AMO_CART");wrap.replaceChildren();const done=document.createElement("div");done.className="done";done.style.gridColumn="1/-1";const h=document.createElement("h1");h.textContent="ĐẶT HÀNG THÀNH CÔNG";const p1=document.createElement("p");p1.textContent="Mã đơn: "+String(d.order_no||"");const p2=document.createElement("p");p2.textContent="Tổng: "+money(d.total);const p3=document.createElement("p");p3.textContent="Hãy lưu mã đơn để đối chiếu khi cần hỗ trợ.";const a1=document.createElement("a");a1.href="contact.html";a1.textContent="Liên hệ AMO";const sep=document.createTextNode(" · ");const a2=document.createElement("a");a2.href="shop.html";a2.textContent="Tiếp tục xem bộ sưu tập";done.append(h,p1,p2,p3,a1,sep,a2);wrap.appendChild(done)}catch(e){msg.textContent=e.message;submitting=false;place.disabled=false}};
</script></body></html>
