<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giỏ hàng | AMO NGUYEN</title><link rel="stylesheet" href="css/amo-style.css"><style>.wrap{max-width:1050px;margin:auto;padding:7rem 5%}.item{display:grid;grid-template-columns:90px 1fr 100px 120px 40px;gap:18px;align-items:center;border-bottom:1px solid #ddd;padding:16px 0}.item img{width:90px;height:110px;object-fit:cover}.item input{width:70px;padding:8px}.total{text-align:right;font-size:1.35rem;margin:25px 0}.btn{display:inline-block;background:#111;color:#fff;padding:14px 22px;text-decoration:none;border:0;cursor:pointer}.empty{text-align:center;padding:60px}@media(max-width:700px){.item{grid-template-columns:70px 1fr 35px}.item img{width:70px;height:90px}.item input,.line{grid-column:2}}</style></head><body><main class="wrap"><a href="shop.html">← Tiếp tục mua sắm</a><h1 class="amo-h1">GIỎ HÀNG</h1><div id="list"></div><div class="total" id="total"></div><div style="text-align:right"><a class="btn" id="checkout" href="checkout.html">TIẾN HÀNH CHECKOUT</a></div></main><script>
const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n||0))+" đ";let c=JSON.parse(localStorage.AMO_CART||"[]");function save(){localStorage.AMO_CART=JSON.stringify(c);render()}function render(){if(!c.length){list.innerHTML='<div class="empty">Giỏ hàng đang trống.</div>';total.textContent="";checkout.style.display="none";return}checkout.style.display="inline-block";list.innerHTML=c.map((x,i)=>'<div class="item"><img src="'+x.image+'" alt=""><div><b>'+x.name+'</b><br><small>'+[x.size,x.color,x.sku].filter(Boolean).join(" · ")+'</small></div><input type="number" min="1" max="20" value="'+x.qty+'" onchange="c['+i+'].qty=Math.max(1,Math.min(20,+this.value||1));save()"><div class="line">'+money(x.price*x.qty)+'</div><button onclick="c.splice('+i+',1);save()">×</button></div>').join("");total.textContent="Tổng: "+money(c.reduce((a,x)=>a+x.price*x.qty,0))}render();
</script></body></html>
