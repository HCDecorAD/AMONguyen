<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giỏ hàng | AMO NGUYEN</title><link rel="stylesheet" href="css/amo-style.css"><style>.wrap{max-width:1050px;margin:auto;padding:7rem 5%}.item{display:grid;grid-template-columns:90px 1fr 100px 120px 40px;gap:18px;align-items:center;border-bottom:1px solid #ddd;padding:16px 0}.item img{width:90px;height:110px;object-fit:cover}.item input{width:70px;padding:8px}.total{text-align:right;font-size:1.35rem;margin:25px 0}.btn{display:inline-block;background:#111;color:#fff;padding:14px 22px;text-decoration:none;border:0;cursor:pointer}.empty{text-align:center;padding:60px}@media(max-width:700px){.item{grid-template-columns:70px 1fr 35px}.item img{width:70px;height:90px}.item input,.line{grid-column:2}}</style></head><body><main class="wrap"><a href="shop.html">← Tiếp tục mua sắm</a><h1 class="amo-h1">GIỎ HÀNG</h1><div id="list"></div><div class="total" id="total"></div><div style="text-align:right"><a class="btn" id="checkout" href="checkout.html">TIẾN HÀNH CHECKOUT</a></div></main><script>
const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n||0))+" đ";let c=[];try{c=JSON.parse(localStorage.AMO_CART||"[]");if(!Array.isArray(c))c=[]}catch{c=[]}
function save(){localStorage.AMO_CART=JSON.stringify(c);render()}
function render(){list.replaceChildren();if(!c.length){const e=document.createElement("div");e.className="empty";e.textContent="Giỏ hàng đang trống.";list.appendChild(e);total.textContent="";checkout.style.display="none";return}checkout.style.display="inline-block";c.forEach((x,i)=>{const row=document.createElement("div");row.className="item";if(x.image){const img=document.createElement("img");img.src=x.image;img.alt=x.name||"Sản phẩm AMO";img.loading="lazy";row.appendChild(img)}else{const ph=document.createElement("div");ph.textContent="AMO";row.appendChild(ph)}const info=document.createElement("div"),b=document.createElement("b"),small=document.createElement("small");b.textContent=x.name||"Sản phẩm AMO";small.textContent=[x.size,x.color,x.sku].filter(Boolean).join(" · ");info.append(b,document.createElement("br"),small);const q=document.createElement("input");q.type="number";q.min="1";q.max="20";q.value=Math.max(1,Math.min(20,Number(x.qty)||1));q.onchange=()=>{c[i].qty=Math.max(1,Math.min(20,Number(q.value)||1));save()};const line=document.createElement("div");line.className="line";line.textContent=money(Number(x.price||0)*Number(x.qty||0));const rm=document.createElement("button");rm.type="button";rm.setAttribute("aria-label","Xóa sản phẩm");rm.textContent="×";rm.onclick=()=>{c.splice(i,1);save()};row.append(info,q,line,rm);list.appendChild(row)});total.textContent="Tổng: "+money(c.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||0),0))}
render();
</script></body></html>
