<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media | AMO NGUYỄN - Giày Si Hiệu Nam</title>
  <meta name="description" content="Ảnh, video và trình chiếu về giày si hiệu nam của AMO NGUYỄN.">
  <meta property="og:title" content="Media | AMO NGUYỄN">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://amonguyen.com/media.html">
  <link rel="stylesheet" href="css/amo-style.css?v=20261019">
  <link rel="stylesheet" href="css/amo-responsive.css">
  <link rel="stylesheet" href="css/amo-localwp.css?v=20261019">
  <style>
    .md-wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
    .md-kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--lw-gold-2);margin:0}
    .md-title{font-size:30px;font-weight:600;margin:6px 0 18px;color:var(--lw-text)}
    .md-tabs{display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--lw-line);margin-bottom:22px}
    .md-tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--lw-mute);font-family:inherit;font-size:14px;font-weight:600;padding:12px 16px;cursor:pointer;letter-spacing:.04em}
    .md-tab[aria-selected="true"]{color:var(--lw-gold-2);border-bottom-color:var(--lw-gold)}
    .md-tab:focus-visible{outline:2px solid var(--lw-gold);outline-offset:2px}
    .md-panel[hidden]{display:none}
    .md-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
    .md-card{border:1px solid var(--lw-line);background:var(--lw-card);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
    .md-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#222}
    .md-card .md-cap{padding:10px 12px;font-size:13px;color:var(--lw-soft)}
    .md-embed{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;border:1px solid var(--lw-line)}
    .md-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .md-link{display:block;padding:14px 16px;border:1px solid var(--lw-line);background:var(--lw-card);border-radius:6px;color:var(--lw-text);text-decoration:none;margin-bottom:10px}
    .md-link:hover,.md-link:focus-visible{border-color:var(--lw-gold)}
    .md-link small{display:block;color:var(--lw-mute);margin-top:4px;word-break:break-all}
    .md-empty{color:var(--lw-mute);padding:30px 0}
    @media(max-width:600px){.md-title{font-size:24px}.md-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
  </style>
</head>
<body>
  <header class="amo-new-header"></header>

  <main class="md-wrap">
    <p class="md-kicker">AMO NGUYỄN</p>
    <h1 class="md-title">Media</h1>

    <div class="md-tabs" role="tablist" aria-label="Loại media">
      <button class="md-tab" role="tab" id="tab-images" aria-controls="panel-images" aria-selected="true" data-tab="images">Ảnh</button>
      <button class="md-tab" role="tab" id="tab-videos" aria-controls="panel-videos" aria-selected="false" data-tab="videos">Video</button>
      <button class="md-tab" role="tab" id="tab-slides" aria-controls="panel-slides" aria-selected="false" data-tab="slides">Trình chiếu</button>
    </div>

    <section class="md-panel" id="panel-images" role="tabpanel" aria-labelledby="tab-images"><div class="md-grid" id="list-images"></div></section>
    <section class="md-panel" id="panel-videos" role="tabpanel" aria-labelledby="tab-videos" hidden><div id="list-videos"></div></section>
    <section class="md-panel" id="panel-slides" role="tabpanel" aria-labelledby="tab-slides" hidden><div id="list-slides"></div></section>
  </main>

  <script>
  (function () {
    var EMPTY = "Chưa có nội dung.";

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function youtubeId(url) {
      var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
      return m ? m[1] : "";
    }

    /* Link Facebook (reel, video, watch) và TikTok nhúng được nếu video công khai */
    function socialEmbed(url) {
      var fb = /facebook\.com\/(?:[^\/]+\/)?(?:reel|videos|watch)|fb\.watch|facebook\.com\/watch/.test(url);
      if (fb) return "https://www.facebook.com/plugins/video.php?href=" + encodeURIComponent(url) + "&show_text=false&width=560";
      var tt = url.match(/tiktok\.com\/@[^\/]+\/video\/(\d+)/);
      if (tt) return "https://www.tiktok.com/embed/v2/" + tt[1];
      return "";
    }

    function slidesEmbed(url) {
      var m = url.match(/docs\.google\.com\/presentation\/d\/([A-Za-z0-9_-]+)/);
      return m ? "https://docs.google.com/presentation/d/" + m[1] + "/embed" : "";
    }

    function safeUrl(u) {
      try {
        var x = new URL(u);
        return (x.protocol === "https:" || x.protocol === "http:") ? x.href : "";
      } catch (e) { return ""; }
    }

    function linkCard(title, url) {
      var a = el("a", "md-link");
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.appendChild(el("span", "", title || url));
      a.appendChild(el("small", "", url));
      return a;
    }

    function render(data) {
      var imgs = document.getElementById("list-images");
      (data.images || []).forEach(function (it) {
        var src = safeUrl(it.src || it.url); if (!src) return;
        var card = el("figure", "md-card");
        card.style.margin = "0";
        var img = el("img"); img.src = src; img.alt = it.alt || it.title || ""; img.loading = "lazy";
        card.appendChild(img);
        if (it.caption || it.title) card.appendChild(el("figcaption", "md-cap", it.caption || it.title));
        imgs.appendChild(card);
      });
      if (!imgs.children.length) imgs.appendChild(el("p", "md-empty", EMPTY));

      var vids = document.getElementById("list-videos");
      (data.videos || []).forEach(function (it) {
        var url = safeUrl(it.url); if (!url) return;
        var yt = youtubeId(url);
        var se = yt ? "" : socialEmbed(url);
        if (yt || se) {
          var box = el("div", "md-embed");
          var f = el("iframe"); f.src = yt ? "https://www.youtube-nocookie.com/embed/" + yt : se;
          if (!yt) f.style.background = "#000";
          f.title = it.title || "Video"; f.allow = "accelerometer; encrypted-media; picture-in-picture"; f.loading = "lazy";
          box.appendChild(f); vids.appendChild(el("h3", "", it.title || "")); vids.appendChild(box);
        } else {
          vids.appendChild(linkCard(it.title, url));
        }
      });
      if (!vids.children.length) vids.appendChild(el("p", "md-empty", EMPTY));

      var slides = document.getElementById("list-slides");
      (data.slides || []).forEach(function (it) {
        var url = safeUrl(it.url); if (!url) return;
        var emb = slidesEmbed(url);
        if (emb) {
          var box = el("div", "md-embed");
          var f = el("iframe"); f.src = emb; f.title = it.title || "Trình chiếu"; f.loading = "lazy"; f.allowFullscreen = true;
          box.appendChild(f); slides.appendChild(el("h3", "", it.title || "")); slides.appendChild(box);
        } else {
          slides.appendChild(linkCard(it.title, url));
        }
      });
      if (!slides.children.length) slides.appendChild(el("p", "md-empty", EMPTY));
    }

    function show(name) {
      document.querySelectorAll(".md-tab").forEach(function (t) {
        t.setAttribute("aria-selected", t.dataset.tab === name ? "true" : "false");
      });
      ["images", "videos", "slides"].forEach(function (n) {
        document.getElementById("panel-" + n).hidden = n !== name;
      });
      try { history.replaceState(null, "", "#" + name); } catch (e) {}
    }

    document.querySelectorAll(".md-tab").forEach(function (t) {
      t.addEventListener("click", function () { show(t.dataset.tab); });
    });

    var ENGINE = "https://hc-shop-engine.huycuongonline.workers.dev";
    fetch(ENGINE + "/api/public/media?store=store_amo", { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.json() : { items: [] }; })
      .catch(function () { return { items: [] }; })
      .then(function (d) {
        var items = d.items || [];
        render({
          images: items.filter(function (x) { return x.kind === "image"; }),
          videos: items.filter(function (x) { return x.kind === "video"; }),
          slides: items.filter(function (x) { return x.kind === "slide"; })
        });
        var h = (location.hash || "").replace("#", "");
        if (h === "videos" || h === "slides") show(h);
      });
  })();
  </script>

  <script src="js/amo-app.js"></script>
  <script src="js/amo-theme.js?v=20261019" defer></script>
  <script src="js/amo-localwp.js?v=2026101702" defer></script>
</body>
</html>
