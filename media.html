<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media | AMO NGUYỄN - Giày Si Hiệu Nam</title>
  <meta name="description" content="Video giày si hiệu nam của AMO NGUYỄN.">
  <meta property="og:title" content="Media | AMO NGUYỄN">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://amonguyen.com/media.html">
  <link rel="stylesheet" href="css/amo-style.css?v=20261019">
  <link rel="stylesheet" href="css/amo-responsive.css">
  <link rel="stylesheet" href="css/amo-localwp.css?v=20261019">
  <style>
    .md-wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
    .md-kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--lw-gold-2);margin:0}
    .md-title{font-size:30px;font-weight:600;margin:6px 0 22px;color:var(--lw-text)}
    .md-row{display:flex;flex-direction:column;align-items:center;gap:26px;padding:4px 0 24px}
    .md-item{flex:0 0 auto;width:100%;max-width:330px}
    .md-tt-ph{position:relative;aspect-ratio:9/16;width:100%;background:#000;border:1px solid var(--lw-line);border-radius:6px;display:flex;align-items:center;justify-content:center}
    .md-tt-btn{padding:12px 18px;border-radius:999px;border:1px solid var(--lw-gold);background:transparent;color:var(--lw-gold-2);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
    .md-tt-btn:hover,.md-tt-btn:focus-visible{background:var(--lw-gold);color:var(--lw-gold-ink)}
    .md-item h3{font-size:15px;font-weight:600;line-height:1.4;margin:0 0 10px;color:var(--lw-text);min-height:42px}
    .md-embed{position:relative;width:100%;aspect-ratio:9/16;background:#000;border-radius:6px;overflow:hidden;border:1px solid var(--lw-line)}
    .md-embed.md-wide{aspect-ratio:16/9}
    .md-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .md-open{display:block;text-align:center;margin:10px 0 0;padding:10px 14px;border-radius:999px;border:1px solid var(--lw-gold);color:var(--lw-gold-2);text-decoration:none;font-size:14px;font-weight:600}
    .md-open:hover,.md-open:focus-visible{background:var(--lw-gold);color:var(--lw-gold-ink)}
    .md-link{display:block;padding:14px 16px;border:1px solid var(--lw-line);background:var(--lw-card);border-radius:6px;color:var(--lw-text);text-decoration:none}
    .md-link:hover,.md-link:focus-visible{border-color:var(--lw-gold)}
    .md-link small{display:block;color:var(--lw-mute);margin-top:4px;word-break:break-all}
    .md-empty{color:var(--lw-mute);padding:30px 0}
    @media(max-width:600px){.md-title{font-size:24px}}
    .md-play{position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;width:68px;height:68px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:26px;cursor:pointer;z-index:2}
    .md-play[hidden]{display:none}
  </style>
</head>
<body>
  <header class="amo-new-header"></header>

  <main class="md-wrap">
    <p class="md-kicker">AMO NGUYỄN</p>
    <h1 class="md-title">Video</h1>
    <div class="md-row" id="list-videos"></div>
  </main>

  <script>
  (function () {
    var EMPTY = "Chưa có video.";

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function youtubeId(url) {
      var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
      return m ? m[1] : "";
    }

    /* Link Facebook (reel, video, watch) và TikTok nhúng được nếu video công khai */
    function socialEmbed(url) {
      var fb = /facebook\.com\/(?:[^\/]+\/)?(?:reel|videos|watch)|fb\.watch|facebook\.com\/watch/.test(url);
      if (fb) return "https://www.facebook.com/plugins/video.php?href=" + encodeURIComponent(url) + "&show_text=false&width=560";
      var tt = url.match(/tiktok\.com\/@[^\/]+\/video\/(\d+)/);
      if (tt) return "https://www.tiktok.com/embed/v2/" + tt[1];
      return "";
    }

    function safeUrl(u) {
      try {
        var x = new URL(u);
        return (x.protocol === "https:" || x.protocol === "http:") ? x.href : "";
      } catch (e) { return ""; }
    }

    function linkCard(title, url) {
      var a = el("a", "md-link");
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.appendChild(el("span", "", title || url));
      a.appendChild(el("small", "", url));
      return a;
    }

    /* Chỉ một video phát tại một thời điểm: video khác bị dừng (đặt về trang trống), bấm ▶ để phát lại */
    var players = [];
    function setBlank(p) {
      p.playing = false;
      if (p.f.getAttribute("src") !== "about:blank") { p.f.setAttribute("src", "about:blank"); p.ov.hidden = false; }
    }
    function playP(p) {
      players.forEach(function (q) { if (q !== p && q.playing) setBlank(q); });
      if (p.f.getAttribute("src") !== p.src) p.f.setAttribute("src", p.src);
      p.playing = true;
      p.ov.hidden = true;
    }
    var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var p = players.filter(function (q) { return q.c === e.target; })[0];
        /* Chỉ dừng video đang phát, không đụng video chưa bấm phát */
        if (p && p.playing && !(e.isIntersecting && e.intersectionRatio >= 0.3)) setBlank(p);
      });
    }, { threshold: [0, 0.3] }) : null;
    function register(c, f) {
      var src = f.getAttribute("src");
      if (!src || f.__mdp) return;
      f.__mdp = true;
      if (getComputedStyle(c).position === "static") c.style.position = "relative";
      var ov = el("button", "md-play", "\u25B6");
      ov.type = "button"; ov.setAttribute("aria-label", "Phát video"); ov.hidden = true;
      c.appendChild(ov);
      var p = { c: c, f: f, src: src, ov: ov, playing: false };
      ov.onclick = function () { playP(p); };
      players.push(p);
      if (io) io.observe(c);
    }
    /* Khi người xem bấm vào khung video, khung đó được coi là đang phát */
    window.addEventListener("blur", function () {
      var a = document.activeElement;
      players.forEach(function (p) { if (p.f === a) playP(p); });
    });
    /* TikTok chỉ nạp khi người xem bấm, để tránh bị TikTok giới hạn khi nhiều embed cùng lúc */
    function tiktokPlay(ph, url, id) {
      var bq = el("blockquote", "tiktok-embed");
      bq.setAttribute("cite", url);
      bq.setAttribute("data-video-id", id);
      bq.style.maxWidth = "605px"; bq.style.minWidth = "325px";
      bq.appendChild(el("section"));
      ph.parentNode.replaceChild(bq, ph);
      var s = document.createElement("script");
      s.src = "https://www.tiktok.com/embed.js"; s.async = true;
      document.body.appendChild(s);
      [2000, 5000].forEach(function (t) { setTimeout(scanTikTok, t); });
    }
    function scanTikTok() {
      document.querySelectorAll("blockquote.tiktok-embed iframe").forEach(function (f) {
        var c = f.closest("blockquote"); if (c) register(c, f);
      });
    }

    function render(items) {
      var list = document.getElementById("list-videos");
      items.forEach(function (it) {
        var url = safeUrl(it.url); if (!url) return;
        var yt = youtubeId(url);
        var tt = yt ? null : url.match(/tiktok\.com\/@[^\/]+\/video\/(\d+)/);
        var se = (yt || tt) ? "" : socialEmbed(url);
        var item = el("div", "md-item");
        if (tt) {
          var ph = el("div", "md-tt-ph");
          var ttBtn = el("button", "md-tt-btn", "\u25B6 Xem trong trang");
          ttBtn.type = "button";
          ttBtn.onclick = function () { tiktokPlay(ph, url, tt[1]); };
          ph.appendChild(ttBtn);
          item.appendChild(el("h3", "", it.title || ""));
          item.appendChild(ph);
          var ttOpen = el("a", "md-open", "Xem full trên TikTok");
          ttOpen.href = url; ttOpen.target = "_blank"; ttOpen.rel = "noopener";
          item.appendChild(ttOpen);
        } else if (yt || se) {
          var shorts = /youtube\.com\/shorts\//.test(url);
          var box = el("div", "md-embed" + (yt && !shorts ? " md-wide" : ""));
          var f = el("iframe");
          f.src = yt ? "https://www.youtube-nocookie.com/embed/" + yt + "?loop=1&playlist=" + yt + "&rel=0&modestbranding=1&playsinline=1" : se;
          if (!yt) f.style.background = "#000";
          f.title = it.title || "Video";
          f.allow = "accelerometer; encrypted-media; picture-in-picture; autoplay";
          f.loading = "lazy"; f.allowFullscreen = true;
          box.appendChild(f);
          register(box, f);
          item.appendChild(el("h3", "", it.title || ""));
          item.appendChild(box);
          var open = el("a", "md-open", yt ? "Xem full trên YouTube" : "Xem full trên " + (/tiktok/.test(url) ? "TikTok" : "Facebook"));
          open.href = url; open.target = "_blank"; open.rel = "noopener";
          item.appendChild(open);
        } else {
          item.appendChild(linkCard(it.title, url));
        }
        list.appendChild(item);
      });
      if (!list.children.length) list.appendChild(el("p", "md-empty", EMPTY));
    }

    var ENGINE = "https://hc-shop-engine.huycuongonline.workers.dev";
    fetch(ENGINE + "/api/public/media?store=store_amo", { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.json() : { items: [] }; })
      .catch(function () { return { items: [] }; })
      .then(function (d) {
        render((d.items || []).filter(function (x) { return x.kind === "video"; }));
      });
  })();
  </script>

  <script src="js/amo-app.js"></script>
  <script src="js/amo-theme.js?v=20261019" defer></script>
  <script src="js/amo-localwp.js?v=2026101902" defer></script>
</body>
</html>
